<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Control Panel - Display</title>
  <style>
    :root {
      color-scheme: light;
      --bg-top: #e8f3ec;
      --bg-bottom: #d4e8dc;
      --card: #ffffff;
      --card-elevated: #ffffff;
      --line: #c8dbd0;
      --line-soft: #e3efe8;
      --text: #0f2418;
      --muted: #5a7268;
      --brand: #0a4d2e;
      --brand-2: #137a4a;
      --brand-3: #198754;
      --brand-soft: #e8f6ee;
      --brand-glow: rgba(19, 122, 74, 0.18);
      --danger: #c62828;
      --danger-soft: #fdecea;
      --warn: #e65100;
      --shadow-sm: 0 1px 2px rgba(10, 36, 24, 0.06);
      --shadow-md: 0 8px 24px rgba(10, 36, 24, 0.1);
      --shadow-lg: 0 16px 40px rgba(10, 36, 24, 0.14);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-pill: 999px;
    }

    * { box-sizing: border-box; }

    html {
      background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      background-attachment: fixed;
    }

    body {
      margin: 0;
      font-family: "Anuphan", "Noto Sans Thai", "Leelawadee UI", "Segoe UI", Tahoma, sans-serif;
      font-size: 16px;
      background: transparent;
      color: var(--text);
      min-height: 100dvh;
      padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      width: min(100%, 1200px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: var(--shadow-sm);
      min-width: 0;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-header {
      position: sticky;
      top: max(8px, env(safe-area-inset-top));
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(200, 219, 208, 0.85);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      box-shadow: var(--shadow-md);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
      font-size: 1.35rem;
      box-shadow: 0 6px 16px var(--brand-glow);
    }

    .header-copy {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.14rem, 3.6vw, 1.48rem);
      color: var(--brand);
      line-height: 1.15;
      letter-spacing: -0.01em;
      font-weight: 900;
    }

    .conn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--brand-soft);
      border: 1px solid #cfe6d8;
      font-size: clamp(0.8rem, 2.6vw, 0.92rem);
      font-weight: 700;
      line-height: 1.2;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .conn-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9aa7a0;
      flex: 0 0 auto;
    }

    .muted {
      color: var(--muted);
      font-size: clamp(0.88rem, 2.9vw, 1rem);
      line-height: 1.25;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: clamp(1rem, 2.8vw, 1.12rem);
      font-weight: 900;
      line-height: 1.15;
      color: var(--text);
    }

    .section-title .muted {
      font-weight: 700;
      text-align: right;
      font-size: clamp(0.82rem, 2.4vw, 0.94rem);
    }

    .section-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .section-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .mini-btn {
      min-height: 32px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.88rem;
      line-height: 1;
      white-space: nowrap;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .mini-btn:hover {
      background: var(--brand-soft);
      border-color: #b8d4c4;
    }

    .mini-btn:active {
      transform: translateY(1px);
    }

    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 800;
      font-size: clamp(1rem, 3.2vw, 1.12rem);
      line-height: 1.1;
      min-height: 48px;
      box-shadow: var(--shadow-sm);
      transition: background 140ms ease, transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease, color 140ms ease;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .btn:hover {
      background: #f7fbf9;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(10, 36, 24, 0.08);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .btn:focus-visible,
    .mini-btn:focus-visible {
      outline: 3px solid var(--brand-glow);
      outline-offset: 2px;
    }

    .btn.primary {
      border-color: var(--brand-2);
      background: linear-gradient(145deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
    }

    .btn.primary:hover {
      background: linear-gradient(145deg, var(--brand-2) 0%, var(--brand-3) 100%);
    }

    .btn.secondary {
      border-color: var(--line);
      background: #f8fbf9;
      color: var(--muted);
    }

    .btn.utility {
      min-height: 42px;
      padding-inline: 14px;
      font-size: clamp(0.92rem, 2.6vw, 1rem);
      border-radius: var(--radius-pill);
      white-space: nowrap;
    }

    .btn.active {
      border-color: var(--brand-2);
      background: linear-gradient(145deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
      box-shadow: 0 4px 14px var(--brand-glow);
    }

    .transport-card {
      background: linear-gradient(180deg, #ffffff 0%, #f6fbf8 100%);
      border-color: #bdd4c8;
    }

    .transport-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .transport-btn {
      min-height: clamp(64px, 16vw, 84px);
      font-size: clamp(1.2rem, 4.8vw, 1.72rem);
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #btnPrev {
      background: #fff;
      border-color: #b8d4c4;
    }

    #btnNext {
      background: linear-gradient(145deg, var(--brand) 0%, var(--brand-2) 100%);
      border-color: var(--brand-2);
      color: #fff;
    }

    #btnNext:hover {
      background: linear-gradient(145deg, var(--brand-2) 0%, var(--brand-3) 100%);
      color: #fff;
    }

    .transport-icon {
      font-size: 1.35em;
      line-height: 1;
      font-weight: 400;
    }

    #btnRefresh {
      width: 100%;
      margin-top: 10px;
      min-height: 48px;
      font-weight: 800;
      border-radius: var(--radius-sm);
    }

    .control-board {
      display: grid;
      grid-template-columns: minmax(132px, 34vw) minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .nav-stack {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .category-stack {
      display: grid;
      gap: 10px;
      align-content: start;
      min-width: 0;
    }

    .control-board .transport-grid {
      grid-template-columns: 1fr;
    }

    .control-board .transport-btn {
      min-height: 50px;
      font-size: clamp(0.94rem, 3.1vw, 1.16rem);
    }

    .control-board #btnRefresh {
      margin-top: 8px;
      min-height: 42px;
      font-size: clamp(0.84rem, 2.6vw, 0.96rem);
      padding: 8px;
    }

    .control-board .main-card .grid {
      grid-template-columns: 1fr;
    }

    .control-board #mainGrid .btn {
      min-height: 50px;
      font-size: clamp(0.92rem, 2.9vw, 1.06rem);
    }

    .control-board .sub-card .grid {
      grid-template-columns: 1fr;
    }

    .control-board #subGrid .btn {
      min-height: 46px;
      font-size: clamp(0.9rem, 2.8vw, 1.04rem);
    }

    .control-board .subpage-card .grid {
      grid-template-columns: 1fr;
    }

    .control-board #subPageGrid .btn {
      min-height: 42px;
      font-size: clamp(0.88rem, 2.6vw, 1rem);
      justify-content: center;
      text-align: center;
    }

    .control-board .subpage-card .section-title {
      margin-bottom: 8px;
    }

    .control-board .subpage-card .muted {
      font-size: 0.76rem;
    }

    .settings-deck {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .mode-actions {
      display: flex;
      padding: 4px;
      gap: 4px;
      border-radius: var(--radius-pill);
      background: #edf5f0;
      border: 1px solid var(--line-soft);
    }

    .mode-actions .btn {
      flex: 1;
      min-height: 52px;
      border: none;
      background: transparent;
      box-shadow: none;
      border-radius: var(--radius-pill);
      font-size: clamp(0.98rem, 3.2vw, 1.14rem);
      font-weight: 900;
      color: var(--muted);
    }

    .mode-actions .btn:hover {
      background: rgba(255, 255, 255, 0.7);
      transform: none;
      box-shadow: none;
      color: var(--text);
    }

    .mode-actions .btn.active {
      background: #fff;
      color: var(--brand);
      box-shadow: var(--shadow-sm);
      border: 1px solid #cfe6d8;
    }

    .wall-open-links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .wall-open-links .mini-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      text-decoration: none;
    }

    .product-filter-card {
      border-color: #b7d6c5;
      background: linear-gradient(180deg, #ffffff 0%, #f3fbf6 100%);
    }

    .product-filter-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
    }

    .product-filter-input {
      width: 100%;
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: clamp(1.05rem, 3.8vw, 1.22rem);
      font-weight: 800;
      outline: none;
    }

    .product-filter-input:focus {
      border-color: var(--brand-2);
      box-shadow: 0 0 0 3px var(--brand-glow);
    }

    .product-filter-form .btn {
      min-height: 56px;
      border-radius: var(--radius-md);
    }

    .category-panel {
      border-color: #cfe0d7;
    }

    .main-card {
      background: linear-gradient(180deg, #ffffff 0%, #fbfefb 100%);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      align-content: start;
    }

    .grid .btn {
      min-height: 58px;
      height: 100%;
      font-size: clamp(0.98rem, 3.2vw, 1.14rem);
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      white-space: normal;
      line-height: 1.12;
      padding: 10px 12px;
      font-weight: 800;
      word-break: break-word;
      overflow-wrap: anywhere;
      border-radius: var(--radius-sm);
      border-color: var(--line-soft);
      background: #fff;
      position: relative;
      overflow: hidden;
    }

    .grid .btn::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: transparent;
      transition: background 140ms ease;
    }

    .grid .btn.active {
      background: var(--brand-soft);
      color: var(--brand);
      border-color: #a8d4bc;
      box-shadow: inset 0 0 0 1px rgba(19, 122, 74, 0.12);
    }

    .grid .btn.active::before {
      background: var(--brand-2);
    }

    #mainGrid .btn {
      min-height: 62px;
      font-size: clamp(1rem, 3.4vw, 1.18rem);
      font-weight: 900;
    }

    #subGrid .btn {
      min-height: 54px;
    }

    #subPageGrid {
      grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    }

    #subPageGrid .btn {
      min-height: 46px;
      justify-content: center;
      text-align: center;
      font-size: clamp(0.96rem, 2.8vw, 1.08rem);
    }

    .state {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .state-item {
      min-width: 0;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      background: linear-gradient(180deg, #fbfffd 0%, #f3f9f5 100%);
    }

    .state-item small {
      display: block;
      color: var(--muted);
      font-size: clamp(0.74rem, 2.3vw, 0.86rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .state-item b {
      display: block;
      color: var(--brand);
      font-size: clamp(0.98rem, 3vw, 1.12rem);
      line-height: 1.15;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    @supports (text-wrap: balance) {
      .grid .btn,
      .state-item b,
      .health-item b {
        text-wrap: balance;
      }
    }

    .health-card {
      background: #fafcfb;
    }

    .health-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .health-card.collapsed .health-grid {
      display: none;
    }

    .health-item {
      min-width: 0;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      background: #fff;
    }

    .health-item small {
      display: block;
      color: var(--muted);
      font-size: clamp(0.74rem, 2.3vw, 0.86rem);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .health-item b {
      display: block;
      color: var(--text);
      font-size: clamp(0.96rem, 2.9vw, 1.08rem);
      line-height: 1.15;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .health-dot {
      display: inline-block;
      width: 0.72em;
      height: 0.72em;
      border-radius: 50%;
      margin-right: 6px;
      background: #9aa7a0;
      box-shadow: 0 0 0 3px rgba(154, 167, 160, 0.14);
      vertical-align: middle;
    }

    .health-dot.ok {
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.16);
    }

    .health-dot.warn {
      background: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.16);
    }

    .health-dot.bad {
      background: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.16);
    }

    .gas-config {
      display: none !important;
      flex-wrap: wrap;
      margin-top: 8px;
      gap: 8px;
    }

    .gas-url-input {
      flex: 1;
      min-width: 240px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
    }

    .main-card .grid,
    .sub-card .grid,
    .subpage-card .grid {
      max-height: none;
      overflow: visible;
      padding-right: 0;
    }

    .voice-widget {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 80;
      display: grid;
      gap: 10px;
      justify-items: end;
      width: auto;
      pointer-events: none;
    }

    .voice-widget > * {
      pointer-events: auto;
    }

    .voice-float-button {
      min-height: 56px;
      width: fit-content;
      max-width: 100%;
      border-radius: var(--radius-pill);
      border: none;
      background: linear-gradient(145deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
      padding: 0 20px;
      box-shadow: var(--shadow-lg);
      font-size: clamp(1rem, 3.1vw, 1.14rem);
      white-space: nowrap;
      font-weight: 900;
    }

    .voice-float-button.listening {
      background: linear-gradient(145deg, #b42318 0%, #d92d20 100%);
      box-shadow: 0 0 0 4px rgba(180, 35, 24, 0.18), var(--shadow-lg);
      animation: pulse-mic 1.4s ease-in-out infinite;
    }

    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .voice-panel {
      width: min(380px, 100%);
      border: 1px solid #cfe0d7;
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: var(--shadow-lg);
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .voice-panel[hidden] {
      display: none;
    }

    .voice-panel-title {
      align-items: center;
      gap: 10px;
    }

    .voice-panel-title .mini-btn {
      margin-left: auto;
    }

    .voice-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: stretch;
    }

    #btnVoiceListen {
      min-height: 54px;
      border: none;
      background: linear-gradient(145deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
      font-size: clamp(1.04rem, 3.4vw, 1.24rem);
    }

    #btnVoiceListen.listening {
      background: linear-gradient(145deg, #b42318 0%, #d92d20 100%);
      box-shadow: 0 0 0 4px rgba(180, 35, 24, 0.12);
    }

    #btnVoiceClear {
      min-width: 88px;
      min-height: 54px;
    }

    .voice-status,
    .voice-transcript {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      background: #f6fbf8;
      padding: 10px 12px;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
      font-size: 0.94rem;
    }

    .voice-transcript b {
      color: var(--brand);
    }

    .voice-examples {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .voice-chip {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      border-radius: var(--radius-pill);
      background: var(--brand-soft);
      color: var(--brand);
      border: 1px solid #cfe6d8;
      padding: 5px 11px;
      font-size: clamp(0.8rem, 2.3vw, 0.9rem);
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    @media (min-width: 720px) {
      .wrap {
        gap: 14px;
      }

      .card {
        padding: 16px;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }

      .state {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .control-board {
        grid-template-columns: minmax(200px, 260px) minmax(0, 1fr);
        gap: 12px;
      }

      .nav-stack,
      .category-stack {
        gap: 12px;
      }

      .control-board .transport-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .control-board .transport-btn {
        min-height: clamp(58px, 10vw, 72px);
        font-size: clamp(1.1rem, 2.4vw, 1.48rem);
      }

      .control-board .main-card .grid {
        grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      }

      .control-board .sub-card .grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }

      .control-board .subpage-card .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 900px) {
      body {
        overflow: auto;
      }

      .wrap {

<body>
  <div class="wrap">
    <header class="control-header">

  <script>
    const STORAGE_KEY = "tv-price-display-modern-premium-v9";
    const CONTROL_COMMAND_KEY = "tv-display-control-command-v1";
    const CONTROL_META_KEY = "tv-display-control-meta-v1";
    const CONTROL_WEBAPP_KEY = "tv-display-control-webapp-url";
    const CONTROL_CHANNEL_NAME = "tv-display-control-channel-v1";
    const CONTROL_CLIENT_ID_KEY = "tv-display-control-client-id-v1";
    const WALL_MODE_KEY = "tv-display-wall-mode-v1";
    const AUTO_PLAY_KEY = "tv-display-auto-play-v1";
    const HEALTH_COLLAPSED_KEY = "tv-display-health-collapsed-v1";
    const DEFAULT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxxcQZih3EeXbBoBVv9faUUFJ3b9CZaRG70enizHyo-2lNfTbSTDirCo0Txwq9fy_h83g/exec";
    const REMOTE_META_POLL_MS = 2000;
    const AUTO_PLAY_PENDING_MS = 7000;
    const APP_VERSION = "display-product-filter-control-20260812-no-voice-control";
    const VERSION_CHECK_INTERVAL_MS = 60 * 1000;
    const VOICE_TRIGGER_PREFIXES = [
      "เปิด", "โปรด", "พบ", "เปด", "เผิด", "เพิ่ม",
      "สั่ง", "สัง", "ไป", "ค้น", "หา", "สูตร", "ล้าง", "ยกเลิก"
    ];
    const VOICE_ACTION_ALIASES = [
      ["รีเฟรช", "refresh", "โหลดใหม่", "อัปเดต", "อัพเดต"],
      ["เปิดอัตโนมัติ", "เล่นอัตโนมัติ", "เริ่มอัตโนมัติ", "เปิดสลับ", "เริ่มสลับ", "สลับอัตโนมัติ"],
      ["หยุดอัตโนมัติ", "ปิดอัตโนมัติ", "หยุดสลับ", "ปิดสลับ", "หยุดเล่น", "พัก", "เปิดหยุดอัตโนมัติ"],
      ["แสดง2จอ", "สองจอ", "2จอ", "วอลล์", "wall"],
      ["แสดง1จอ", "หนึ่งจอ", "1จอ", "จอเดียว", "เดี่ยว"],
      ["ถัดไป", "ต่อไป", "หน้าถัดไป", "หน้าต่อไป", "ไปต่อ", "ทัดไป", "ที่ไป", "next"],
      ["ก่อนหน้า", "ย้อนกลับ", "กลับหน้า", "ถอย", "prev", "previous"]
    ];
    const VOICE_NAVIGATION_SHORTCUTS = [
      { phrases: ["แม่ปุ๋ย", "แม่พุย", "เมปุ๋ย"], pageAliases: ["แม่ปุ๋ย"] },
      { phrases: ["21-0-0 เกล็ด", "21-0-0 เกร็ด", "21-0-0 ผง", "2100เกล็ด", "2100เกร็ด", "2100ผง", "2100 ผง"], pageAliases: ["แม่ปุ๋ย"], subAliases: ["21-0-0เกร็ด/ผง", "21-0-0เกล็ด", "21-0-0เกร็ด", "21-0-0ผง", "21-0-0 ผง"] },
      { phrases: ["21-0-0 เม็ด", "2100เม็ด", "21-0-0เม็ด", "2100 เม็ด"], pageAliases: ["แม่ปุ๋ย"], subAliases: ["21-0-0เม็ด", "21-0-0 เม็ด"] },
      { phrases: ["18-46-0", "18460"], pageAliases: ["แม่ปุ๋ย"], subAliases: ["46-0-0 และ 18-46-0", "18-46-0"] },
      { phrases: ["0-0-60", "0060"], pageAliases: ["แม่ปุ๋ย"], subAliases: ["0-0-60"] },
      { phrases: ["46-0-0", "4600"], pageAliases: ["แม่ปุ๋ย"], subAliases: ["46-0-0 และ 18-46-0", "46-0-0"] },
      { phrases: ["ปาล์มใหญ่", "ปลามใหญ่", "ปามใหญ่", "ปาล์มใหญ"], pageAliases: ["ปาล์มใหญ่"] },
      { phrases: ["ปาล์มเล็ก", "ปลามเล็ก", "ปามเล็ก"], pageAliases: ["ปาล์มเล็ก"] },
      { phrases: ["ยางกรีด", "ยางเกรด", "ยางกรี", "ยางกรีต"], pageAliases: ["ปุ๋ยยาง", "ยาง"], subAliases: ["ปุ๋ยยางกรีด", "ยางกรีด"] },
      { phrases: ["ยางเล็ก"], pageAliases: ["ปุ๋ยยาง", "ยาง"], subAliases: ["ปุ๋ยยางเล็ก", "ยางเล็ก"] },
      { phrases: ["ปุ๋ยทุเรียน", "ทุเรียน"], pageAliases: ["ปุ๋ยทุเรียน", "ทุเรียน"] },
      { phrases: ["ปุ๋ยอินทรีย์เคมี", "อินทรีย์เคมี", "อินทรียเคมี"], pageAliases: ["ปุ๋ยอินทรีย์เคมี", "อินทรีย์เคมี"] },
      { phrases: ["ปุ๋ยอินทรีย์", "อินทรีย์", "อินทรีย"], pageAliases: ["ปุ๋ยอินทรีย์"] },
      { phrases: ["ปุ๋ยเสมอ", "เสมอ"], pageAliases: ["ปุ๋ยเสมอ", "เสมอ"] },
      { phrases: ["แมกนีเซียม"], pageAliases: ["แมกนีเซียม"], subAliases: ["แมกนีเซียม"] },
      { phrases: ["โดโลไมต์-โบรอน", "โดโลไมต์ โบรอน", "โดโลไมต์", "โบรอน", "โดโลไมท์"], pageAliases: ["โดโลไมต์-โบรอน", "โดโลไมต์โบรอน"], subAliases: ["โดโลไมต์-โบรอน", "โดโลไมต์โบรอน", "โดโลไมต์", "โบรอน"] }
    ];

    const $ = (id) => document.getElementById(id);

    let meta = null;
    let remoteMetaTimer = null;
    let remoteMetaPollInFlight = false;
    let controlBroadcastChannel = null;
    let pendingAutoPlay = null;
    let autoPlayAckTimer = null;
    let lastIssuedCommandAt = 0;
    let voiceRecognition = null;
    let voiceListening = false;
    let voiceRestartTimer = null;
    let lastVoiceCommandText = "";
    let lastVoiceCommandAt = 0;

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>\"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[m]));
    }

    function clean(val) {
      return String(val ?? "").trim();
    }

    function buildDisplayWallUrl(screen) {
      const url = new URL("index.html", window.location.href);
      url.searchParams.set("wallMode", "wall");
      url.searchParams.set("sync", "1");
      url.searchParams.set("syncScope", "all");
      url.searchParams.set("screens", "2");
      url.searchParams.set("screen", String(screen));
      url.searchParams.set("_fresh", APP_VERSION);
      url.searchParams.set("_ts", String(Date.now()));
      return url.toString();
    }

    function refreshWallOpenLinks() {
      const screenOne = $("wallScreenOneLink");
      const screenTwo = $("wallScreenTwoLink");
      if (screenOne) screenOne.href = buildDisplayWallUrl(1);
      if (screenTwo) screenTwo.href = buildDisplayWallUrl(2);
    }

    function validWebAppUrl(url) {
      return /^https:\/\/script\.google\.com\//i.test(clean(url));
    }

    function createControlClientId() {
      const randomPart = Math.random().toString(16).slice(2, 10);
      return `ctrl-${Date.now()}-${randomPart}`;
    }

    function getControlClientId() {
      try {
        const saved = clean(localStorage.getItem(CONTROL_CLIENT_ID_KEY) || "");
        if (saved) return saved;

        const next = createControlClientId();
        localStorage.setItem(CONTROL_CLIENT_ID_KEY, next);
        return next;
      } catch {
        return createControlClientId();
      }
    }

    function getWebAppUrl() {
      const gasUrlInput = $("gasUrlInput");
      const fromInput = clean(gasUrlInput ? gasUrlInput.value : "");
      if (validWebAppUrl(fromInput)) return fromInput;

      const fromLocal = clean(localStorage.getItem(CONTROL_WEBAPP_KEY) || "");
      if (validWebAppUrl(fromLocal)) return fromLocal;

      try {
        const rawMain = localStorage.getItem(STORAGE_KEY);
        const parsed = rawMain ? JSON.parse(rawMain) : null;
        const fromMain = clean(parsed?.controlWebAppUrl || "");
        if (validWebAppUrl(fromMain)) return fromMain;
      } catch {}

      if (validWebAppUrl(DEFAULT_WEBAPP_URL)) return DEFAULT_WEBAPP_URL;

      return "";
    }

    function setHint(text) {
      $("connHint").textContent = text;
    }

    async function checkAppVersion() {
      if (!("fetch" in window) || !("URL" in window)) return;

      try {
        const versionUrl = new URL("version.json", window.location.href);
        versionUrl.searchParams.set("_", String(Date.now()));

        const res = await fetch(versionUrl.toString(), { cache: "no-store" });
        if (!res.ok) return;

        const payload = await res.json();
        const latestVersion = clean(payload?.version);
        if (!latestVersion || latestVersion === APP_VERSION) return;

        const currentUrl = new URL(window.location.href);
        if (currentUrl.searchParams.get("_fresh") === latestVersion) return;

        currentUrl.searchParams.set("_fresh", latestVersion);
        currentUrl.searchParams.set("_ts", String(Date.now()));
        window.location.replace(currentUrl.toString());
      } catch {
        // Local file:// pages and offline devices may block version.json; keep control usable.
      }
    }

    function startVersionCheck() {
      checkAppVersion();
      setInterval(checkAppVersion, VERSION_CHECK_INTERVAL_MS);
    }

    function readHealthCollapsedPreference() {
      try {
        const saved = clean(localStorage.getItem(HEALTH_COLLAPSED_KEY)).toLowerCase();
        if (saved === "0") return false;
        if (saved === "1") return true;
        return true;
      } catch {
        return true;
      }
    }

    function applyHealthCollapsed(collapsed) {
      const card = $("healthCard");
      const btn = $("btnToggleHealth");
      if (!card || !btn) return;

      card.classList.toggle("collapsed", Boolean(collapsed));
      btn.textContent = collapsed ? "แสดง" : "ซ่อน";
      btn.setAttribute("aria-expanded", collapsed ? "false" : "true");

      try {
        localStorage.setItem(HEALTH_COLLAPSED_KEY, collapsed ? "1" : "0");
      } catch {}
    }

    function toggleHealthCollapsed() {
      applyHealthCollapsed(!$("healthCard").classList.contains("collapsed"));
    }

    function storeWallModePreference(mode) {
      const normalized = clean(mode).toLowerCase() === "wall" ? "wall" : "single";

      try {
        localStorage.setItem(WALL_MODE_KEY, normalized);
      } catch {}

      return normalized;
    }

    function readWallModePreference() {
      try {
        const mode = clean(localStorage.getItem(WALL_MODE_KEY)).toLowerCase();
        return mode === "single" || mode === "wall" ? mode : "";
      } catch {
        return "";
      }
    }

    function storeAutoPlayPreference(enabled) {
      const normalized = enabled !== false &&
        clean(enabled).toLowerCase() !== "false" &&
        clean(enabled).toLowerCase() !== "0" &&
        clean(enabled).toLowerCase() !== "paused" &&
        clean(enabled).toLowerCase() !== "off";

      try {
        localStorage.setItem(AUTO_PLAY_KEY, normalized ? "playing" : "paused");
      } catch {}

      return normalized;
    }

    function readAutoPlayPreference() {
      try {
        const mode = clean(localStorage.getItem(AUTO_PLAY_KEY)).toLowerCase();
        if (["paused", "pause", "off", "false", "0", "no"].includes(mode)) return false;
        if (["playing", "play", "on", "true", "1", "yes"].includes(mode)) return true;
      } catch {}

      return true;
    }

    function getAutoPlayEnabledFromMeta(metaPayload = meta) {
      if (!metaPayload || typeof metaPayload !== "object") return null;
      const autoPlay = metaPayload.autoPlay;
      if (!autoPlay || typeof autoPlay !== "object") return null;

      if (typeof autoPlay.enabled === "boolean") return autoPlay.enabled;

      const raw = clean(autoPlay.enabled).toLowerCase();
      if (["playing", "play", "on", "true", "1", "yes"].includes(raw)) return true;
      if (["paused", "pause", "off", "false", "0", "no"].includes(raw)) return false;

      return null;
    }

    function isPendingAutoPlayActive() {
      return pendingAutoPlay && Date.now() - pendingAutoPlay.at < AUTO_PLAY_PENDING_MS;
    }

    function clearAutoPlayAckTimer() {
      if (autoPlayAckTimer) {
        clearTimeout(autoPlayAckTimer);
        autoPlayAckTimer = null;
      }
    }

    function scheduleAutoPlayAckCheck() {
      clearAutoPlayAckTimer();
      autoPlayAckTimer = setTimeout(() => {
        autoPlayAckTimer = null;
        if (!isPendingAutoPlayActive()) {
          pendingAutoPlay = null;
          render();
        }
      }, AUTO_PLAY_PENDING_MS + 150);
    }

    function setPendingAutoPlay(enabled) {
      pendingAutoPlay = {
        enabled: enabled !== false,
        at: Date.now()
      };
      scheduleAutoPlayAckCheck();
    }

    function applyMeta(nextMeta) {
      if (!nextMeta) return;

      const currentUpdatedAt = Number(meta?.updatedAt || 0);
      const nextUpdatedAt = Number(nextMeta.updatedAt || 0);
      if (currentUpdatedAt && nextUpdatedAt && nextUpdatedAt < currentUpdatedAt) return;

      const metaAutoPlay = getAutoPlayEnabledFromMeta(nextMeta);
      if (pendingAutoPlay) {
        if (metaAutoPlay === pendingAutoPlay.enabled) {
          pendingAutoPlay = null;
          clearAutoPlayAckTimer();
        } else if (isPendingAutoPlayActive()) {
          // Keep the real meta, but render the pending user command until the TV confirms it.
        } else {
          pendingAutoPlay = null;
          clearAutoPlayAckTimer();
        }
      }

      meta = nextMeta;
      render();
    }

    function postLocalCommand(cmd) {
      try {
        localStorage.setItem(CONTROL_COMMAND_KEY, JSON.stringify(cmd));
      } catch {}

      try {
        if (!controlBroadcastChannel && "BroadcastChannel" in window) {
          controlBroadcastChannel = new BroadcastChannel(CONTROL_CHANNEL_NAME);
        }
        if (controlBroadcastChannel) controlBroadcastChannel.postMessage(cmd);
      } catch {
        controlBroadcastChannel = null;
      }
    }

    function runJsonp(url, params = {}, timeoutMs = 5000) {
      return new Promise((resolve, reject) => {
        const callbackName = `ctrlJsonp_${Date.now()}_${Math.random().toString(16).slice(2, 8)}`;
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("timeout"));
        }, timeoutMs);

        const cleanup = () => {
          clearTimeout(timer);
          if (window[callbackName]) delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        };

        const u = new URL(url);
        Object.entries(params).forEach(([k, v]) => {
          if (v !== undefined && v !== null) u.searchParams.set(k, String(v));
        });
        u.searchParams.set("callback", callbackName);
        u.searchParams.set("_ts", String(Date.now()));

        window[callbackName] = (payload) => {
          cleanup();
          resolve(payload);
        };

        script.src = u.toString();
        script.onerror = () => {
          cleanup();
          reject(new Error("failed"));
        };
        document.body.appendChild(script);
      });
    }

    function sendCommand(action, extra = {}) {
      const createdAt = Date.now();
      const sourceId = getControlClientId();
      const commandId = `${createdAt}-${sourceId}-${Math.random().toString(16).slice(2, 8)}`;
      const navigationAction = ["next", "prev", "goMain", "goSub", "goSubPage"].includes(action);
      lastIssuedCommandAt = createdAt;
      const cmd = {
        id: commandId,
        dedupeKey: commandId,
        createdAt,
        applyAt: navigationAction ? createdAt + 2500 : 0,
        sourceId,
        source: "control",
        action,
        ...extra
      };

      // ส่งในเครื่องทันที เพื่อให้จอที่อยู่ browser เดียวกันตอบสนองเร็ว
      postLocalCommand(cmd);

      const endpoint = getWebAppUrl();
      if (!endpoint) return;

      const payload = JSON.stringify({
        mode: "push_command",
        source: "control",
        command: cmd
      });

      // ส่งซ้ำช่วงสั้น ๆ เพื่อกันคำสั่งหลุดบน WebView/เครือข่ายทีวี
      // ทุกครั้งใช้ command id เดิม จอจึง dedupe และไม่ข้ามหลายหน้า
      const isCurrentCommand = () => createdAt >= lastIssuedCommandAt;
      const sendOnce = () => {
        if (!isCurrentCommand()) return;

        try {
          if (navigator.sendBeacon) {
            const blob = new Blob([payload], { type: "text/plain;charset=utf-8" });
            if (navigator.sendBeacon(endpoint, blob)) return;
          }
        } catch {}

        try {
          fetch(endpoint, {
            method: "POST",
            mode: "no-cors",
            cache: "no-store",
            keepalive: true,
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: payload
          }).catch(() => {});
        } catch {}
      };

      [0, 120, 260, 700, 1200].forEach((delay) => {
        if (delay === 0) sendOnce();
        else setTimeout(sendOnce, delay);
      });

      if (action === "refresh") {
        [180, 520, 1100].forEach((delay) => {
          setTimeout(() => {
            if (isCurrentCommand()) {
              postLocalCommand({ ...cmd, id: `${cmd.id}-local-${delay}` });
            }
          }, delay);
        });
      }
    }

    function getSpeechRecognitionConstructor() {
      return window.SpeechRecognition || window.webkitSpeechRecognition || null;
    }

    function setVoiceStatus(text) {
      const el = $("voiceStatus");
      if (el) el.textContent = text;
    }

    function setVoiceTranscript(text) {
      const el = $("voiceTranscript");
      if (!el) return;
      el.innerHTML = text ? `ได้ยิน: <b>${escapeHtml(text)}</b>` : "ยังไม่มีคำสั่งเสียง";
    }

    function setVoicePanelOpen(open) {
      const panel = $("voicePanel");
      const toggle = $("btnVoiceToggle");
      const widget = $("voiceWidget");
      if (!panel || !toggle) return;

      panel.hidden = !open;
      widget?.classList.toggle("open", open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    }

    function setVoiceListeningState(listening) {
      voiceListening = Boolean(listening);
      const btn = $("btnVoiceListen");
      if (btn) {
        btn.classList.toggle("listening", voiceListening);
        btn.textContent = voiceListening ? "กำลังฟัง..." : "เริ่มฟังเสียง";
        btn.setAttribute("aria-pressed", voiceListening ? "true" : "false");
      }

      const toggle = $("btnVoiceToggle");
      const toggleText = $("voiceToggleText");
      if (toggle) {
        toggle.classList.toggle("listening", voiceListening);
        toggle.setAttribute("aria-pressed", voiceListening ? "true" : "false");
        toggle.title = voiceListening ? "กดเพื่อหยุดฟังเสียง" : "กดเพื่อเริ่มควบคุมด้วยเสียง";
      }
      if (toggleText) toggleText.textContent = voiceListening ? "กำลังฟัง..." : "🎤 ควบคุมด้วยเสียง";
    }

    function normalizeVoiceNumbers(value) {
      const digitMap = {
        "๐": "0", "๑": "1", "๒": "2", "๓": "3", "๔": "4",
        "๕": "5", "๖": "6", "๗": "7", "๘": "8", "๙": "9"
      };
      let text = clean(value).replace(/[๐-๙]/g, (digit) => digitMap[digit] || digit);
      const words = [
        ["ยี่สิบเอ็ด", "21"], ["สี่สิบหก", "46"], ["หกสิบ", "60"],
        ["ยี่สิบ", "20"], ["สิบเก้า", "19"], ["สิบแปด", "18"], ["สิบเจ็ด", "17"],
        ["สิบหก", "16"], ["สิบห้า", "15"], ["สิบสี่", "14"], ["สิบสาม", "13"],
        ["สิบสอง", "12"], ["สิบเอ็ด", "11"], ["สิบ", "10"], ["เก้า", "9"],
        ["แปด", "8"], ["เจ็ด", "7"], ["หก", "6"], ["ห้า", "5"],
        ["สี่", "4"], ["สาม", "3"], ["สอง", "2"], ["หนึ่ง", "1"],
        ["นึง", "1"], ["แรก", "1"], ["ศูนย์", "0"], ["สูญ", "0"]
      ];

      words.forEach(([word, number]) => {
        text = text.replace(new RegExp(word, "g"), number);
      });
      return text;
    }

    function applyVoiceMishearingFixes(value) {
      let text = clean(value);
      if (/^(โปรด|พบ|เปด|เผิด|เพิ่ม|โปด|พด|เผด)/i.test(text)) {
        text = text.replace(/^(โปรด|พบ|เปด|เผิด|เพิ่ม|โปด|พด|เผด)/i, "เปิด");
      }
      return text
        .replace(/สัง|สั่ง/gi, "สั่ง")
        .replace(/ปลาม|ปาม|ปาลม/gi, "ปาล์ม")
        .replace(/แม่พุย|เมปุ๋ย|แม่ภูย|แม่ภุย|แม่ภุย/gi, "แม่ปุ๋ย")
        .replace(/ยางเกรด|ยางกรีต|ยางกริด|ยางกริต/gi, "ยางกรีด")
        .replace(/ทัดไป|ที่ไป|ทัดไป|ที่ไป/gi, "ถัดไป")
        .replace(/รีเฟส|รีเฟช|รีเฟร|รีเฟร/gi, "รีเฟรช")
        .replace(/อัตโนมัด|อัตโนมัต|อัตโนมั/gi, "อัตโนมัติ")
        .replace(/ก่อนหน้า|ก่อนน้า|ก่อนหนา/gi, "ก่อนหน้า")
        .replace(/ถัดไป|ถัดไป|ต่อไป|ตอไป/gi, "ถัดไป")
        .replace(/หมวดหลัก|หมวดหลั|หมวดหลั/gi, "หมวดหลัก")
        .replace(/หมวดย่อย|หมวดยอย|หมวดยอ/gi, "หมวดย่อย")
        .replace(/อินทรีย์|อินทรีย|อินทรเย|อินทรเย/gi, "อินทรีย์")
        .replace(/โดโลไมต์|โดโลไมท|โดโลไม/gi, "โดโลไมต์")
        .replace(/โบรอน|โบรอ|โบร/gi, "โบรอน")
        .replace(/แมกนีเซียม|แมกนีเซีย|แมกนีเซ/gi, "แมกนีเซียม")
        .replace(/เสมอ|เสมอ|เสม/gi, "เสมอ")
        .replace(/ทุเรียน|ทุเรีย|ทุเร/gi, "ทุเรียน")
        .replace(/ปุ๋ยยาง|ปุ๋ยยา|ปุ๋ยย/gi, "ปุ๋ยยาง")
        .replace(/ปุ๋ยอินทรีย์|ปุ๋ยอินทรีย|ปุ๋ยอินทร/gi, "ปุ๋ยอินทรีย์")
        .replace(/ปุ๋ยอินทรีย์เคมี|ปุ๋ยอินทรีย์เคม|ปุ๋ยอินทรีย์เค/gi, "ปุ๋ยอินทรีย์เคมี");
    }

    function compactVoiceText(value) {
      return normalizeVoiceNumbers(applyVoiceMishearingFixes(value))
        .normalize("NFC")
        .toLowerCase()
        .replace(/ครับ|ค่ะ|คะ|นะ|หน่อย|ช่วย|ให้/g, "")
        .replace(/[\u0E47-\u0E4E]/g, "")
        .replace(/เกลด|เกรด/g, "เกร็ด")
        .replace(/อินทรีย(?!์)/g, "อินทรีย์")
        .replace(/โดโลไม[ตท]?/g, "โดโลไมต์")
        .replace(/[^\u0E00-\u0E7Fa-z0-9]/g, "");
    }

    function stripVoiceTriggerPrefix(value) {
      let compact = compactVoiceText(value);
      const sortedPrefixes = [...VOICE_TRIGGER_PREFIXES].sort((a, b) => b.length - a.length);
      for (const prefix of sortedPrefixes) {
        if (compact.startsWith(prefix)) {
          compact = compact.slice(prefix.length);
          break;
        }
      }
      return compact;
    }

    function getVoiceCommandRemainder(value) {
      return stripVoiceCommandScaffold(value);
    }

    function getVoiceNumberAfter(text, keywords) {
      const compact = compactVoiceText(text);
      for (const keyword of keywords) {
        const compactKeyword = compactVoiceText(keyword);
        const afterMatch = compact.match(new RegExp(`${compactKeyword}(\\d+)`));
        if (afterMatch) return Number(afterMatch[1]);

        const beforeMatch = compact.match(new RegExp(`(\\d+)${compactKeyword}`));
        if (beforeMatch) return Number(beforeMatch[1]);
      }
      return null;
    }

    function normalizeVoiceName(value) {
      return stripVoiceTriggerPrefix(value)
        .replace(/หมวดหลัก|หมวดย่อย|หมวด|กลุ่ม|หน้า/g, "")
        .trim();
    }

    function normalizeVoiceAlias(value) {
      return stripVoiceTriggerPrefix(value);
    }

    function stripVoiceCommandScaffold(value) {
      return stripVoiceTriggerPrefix(value)
        .replace(/กรุณา|ขอ|ดู|เปิดหนา|เปิดหน้า|ไปที|ไปที่|ไป|เลือก|เปลียนเปน|เปลี่ยนเป็น|เปลียน|เปลี่ยน|แสดง|โชว|โชว์|สัง|สั่ง|เอา|เปน|เป็น|ให้เป็น/g, "")
        .replace(/หมวดหลัก|หมวดย่อย|หมวด|กลุ่ม|ย่อย|รายการ|สินค้า/g, "");
    }

    function extractFormulaFromVoice(value) {
      const normalized = normalizeVoiceNumbers(applyVoiceMishearingFixes(value));
      const separated = normalized.match(/(\d{1,2})\s*(?:[-–—/]|\s+)\s*(\d{1,2})\s*(?:[-–—/]|\s+)\s*(\d{1,2})/);
      if (separated) {
        return [separated[1], separated[2], separated[3]].join("-");
      }

      // รองรับผลจาก Speech Recognition ที่คืนค่าเป็น 151030 หรือ 210000
      const compactDigits = normalized.replace(/\D/g, "");
      if (/^\d{6}$/.test(compactDigits)) {
        return `${compactDigits.slice(0, 2)}-${compactDigits.slice(2, 4)}-${compactDigits.slice(4, 6)}`;
      }

      return "";
    }

    function getProductFilterQueryFromVoice(value) {
      const formula = extractFormulaFromVoice(value);
      if (formula) return formula;

      const remainder = getVoiceCommandRemainder(value)
        .replace(/แสดงเฉพาะ|เฉพาะ|ค้นหา|ค้น|หา|สูตร|ปุ๋ยสูตร|ปุ๋ย/g, "")
        .trim();

      if (!remainder || remainder.length < 2) return "";
      if (/^(หลัก|ย่อย|หน้า|จอ|ทีวี|อัตโนมัติ|ถัดไป|ก่อนหน้า)$/i.test(remainder)) return "";
      return remainder;
    }

    function isSafeVoiceRemainder(value) {
      const compact = compactVoiceText(value);
      if (!compact) return true;
      return !compact
        .replace(/หนาจอ|หนา|จอ|ทีวี|หลัก|อัตโนมัติ|ออโต|เลย|เดยวนี|เปิด|พบ|เปด|สั่ง|สัง|ไป/g, "");
    }

    function isBlockedVoiceText(value) {
      const text = clean(value);
      if (!text) return true;
      return /อย่า|ห้าม|ไม่ต้อง|ไม่เอา|ยังไม่|ไม่ใช่|ยกเลิก|คืออะไร|อะไร|ไหม|มั้ย|หรือเปล่า|เท่าไร|เท่าไหร่|ราคา|ขาย|ทดสอบ|ลองพูด|พูดว่า|คำว่า/i.test(text);
    }

    function matchesKnownVoiceAction(text) {
      return VOICE_ACTION_ALIASES.some((aliases) => voiceTextHasAlias(text, aliases));
    }

    function hasVoiceCommandTrigger(value) {
      const compact = compactVoiceText(value);
      if (extractFormulaFromVoice(value)) return true;
      if (VOICE_TRIGGER_PREFIXES.some((prefix) => compact.startsWith(prefix))) return true;
      if (findVoiceShortcutTarget(value)) return true;
      return matchesKnownVoiceAction(value);
    }

    function uniqueVoiceAliases(values) {
      return [...new Set((values || [])
        .map(normalizeVoiceAlias)
        .filter(Boolean))];
    }

    function voiceTextHasAlias(text, aliases) {
      const compact = compactVoiceText(text);
      const commandText = stripVoiceCommandScaffold(text);
      return uniqueVoiceAliases(aliases).some((alias) => {
        if (!alias) return false;
        if (compact === alias || commandText === alias) return true;

        if (alias.length < 3) return false;
        return [compact, commandText].some((source) => {
          if (!source.includes(alias)) return false;
          return isSafeVoiceRemainder(source.replace(alias, ""));
        });
      });
    }

    function getVoicePages() {
      return meta && Array.isArray(meta.pages) ? meta.pages : [];
    }

    function getSubCategoriesForPage(page) {
      return Array.isArray(page?.subCategories) ? page.subCategories : [];
    }

    function findPageByAliases(aliases) {
      const pages = getVoicePages();
      const normalizedAliases = uniqueVoiceAliases(aliases);
      if (!pages.length || !normalizedAliases.length) return null;

      const exact = pages.find((page) => {
        const name = normalizeVoiceAlias(page?.name || "");
        return normalizedAliases.includes(name);
      });
      if (exact) return exact;

      const partialMatches = pages.filter((page) => {
        const name = normalizeVoiceAlias(page?.name || "");
        return name && normalizedAliases.some((alias) => name.includes(alias));
      });
      partialMatches.sort((a, b) => normalizeVoiceAlias(b?.name || "").length - normalizeVoiceAlias(a?.name || "").length);
      return partialMatches[0] || null;
    }

    function findSubCategoryTargetByAliases(subAliases, pageAliases = []) {
      const pages = getVoicePages();
      const normalizedSubAliases = uniqueVoiceAliases(subAliases);
      if (!pages.length || !normalizedSubAliases.length) return null;

      const preferredPage = findPageByAliases(pageAliases);
      const searchPages = preferredPage
        ? [preferredPage, ...pages.filter((page) => page.index !== preferredPage.index)]
        : pages;

      for (const page of searchPages) {
        const exact = getSubCategoriesForPage(page).find((subCategory) => {
          const name = normalizeVoiceAlias(subCategory?.name || "");
          return normalizedSubAliases.includes(name);
        });
        if (exact) return { page, subCategory: exact };
      }

      const partialTargets = [];
      for (const page of searchPages) {
        getSubCategoriesForPage(page).forEach((subCategory) => {
          const name = normalizeVoiceAlias(subCategory?.name || "");
          if (name && normalizedSubAliases.some((alias) => name.includes(alias) || alias.includes(name))) {
            partialTargets.push({ page, subCategory });
          }
        });
      }
      partialTargets.sort((a, b) => {
        return normalizeVoiceAlias(b.subCategory?.name || "").length - normalizeVoiceAlias(a.subCategory?.name || "").length;
      });
      if (partialTargets[0]) return partialTargets[0];

      return null;
    }

    function findVoiceShortcutTarget(text) {
      for (const shortcut of VOICE_NAVIGATION_SHORTCUTS) {
        if (!voiceTextHasAlias(text, shortcut.phrases)) continue;

        if (shortcut.subAliases) {
          const subTarget = findSubCategoryTargetByAliases(shortcut.subAliases, shortcut.pageAliases);
          if (subTarget) {
            return {
              type: "sub",
              page: subTarget.page,
              subCategory: subTarget.subCategory
            };
          }
        }

        if (shortcut.pageAliases) {
          const page = findPageByAliases(shortcut.pageAliases);
          if (page) return { type: "page", page };
        }
      }

      return null;
    }

    function findVoiceNavigationTarget(text) {
      const shortcutTarget = findVoiceShortcutTarget(text);
      if (shortcutTarget) return shortcutTarget;

      const remainder = getVoiceCommandRemainder(text);
      const page = findPageByAliases(remainder ? [remainder] : [text]);
      if (page) return { type: "page", page };

      const subTarget = findSubCategoryTargetByAliases(
        remainder ? [remainder] : [text],
        page ? [page.name] : []
      );
      if (subTarget) {
        return {
          type: "sub",
          page: subTarget.page,
          subCategory: subTarget.subCategory
        };
      }

      return null;
    }

    function sendVoiceNavigationTarget(target) {
      if (!target) return false;

      if (target.type === "sub" && target.page && target.subCategory) {
        sendCommand("goSub", {
          pageIndex: target.page.index,
          subIndex: target.subCategory.index
        });
        const message = `คำสั่งเสียง: ${target.page.name} / ${target.subCategory.name}`;
        setHint(message);
        setVoiceStatus(message);
        return true;
      }

      if (target.type === "page" && target.page) {
        sendCommand("goMain", { pageIndex: target.page.index });
        const message = `คำสั่งเสียง: ${target.page.name}`;
        setHint(message);
        setVoiceStatus(message);
        return true;
      }

      return false;
    }

    function findMainPageByVoice(text) {
      if (!meta || !Array.isArray(meta.pages)) return null;

      const number = getVoiceNumberAfter(text, ["หมวดหลัก", "หมวด"]);
      if (number && number >= 1 && number <= meta.pages.length) {
        return meta.pages[number - 1];
      }

      const remainder = getVoiceCommandRemainder(text);
      if (!remainder) return null;

      return findPageByAliases([remainder]);
    }

    function findSubCategoryByVoice(text) {
      const page = getMainPage();
      const subCategories = Array.isArray(page?.subCategories) ? page.subCategories : [];
      if (!subCategories.length) return null;

      const number = getVoiceNumberAfter(text, ["หมวดย่อย", "กลุ่ม", "ย่อย"]);
      if (number && number >= 1 && number <= subCategories.length) {
        return subCategories[number - 1];
      }

      const normalized = normalizeVoiceName(text);
      if (!normalized) return null;

      const exact = subCategories.find((subCategory) => {
        const name = normalizeVoiceName(subCategory?.name || "");
        return name && name === normalized;
      });
      if (exact) return exact;

      // Try partial match with more flexible conditions
      return subCategories.find((subCategory) => {
        const name = normalizeVoiceName(subCategory?.name || "");
        if (!name) return false;
        // Allow 1 character names if they match exactly
        if (name.length < 2) {
          return normalized === name;
        }
        // For longer names, check if either contains the other
        return normalized.includes(name) || name.includes(normalized);
      }) || null;
    }

    function sendVoiceAutoPlay(enabled) {
      return false;
      const normalized = storeAutoPlayPreference(enabled);
      setPendingAutoPlay(normalized);
      renderAutoPlayButtons();
      sendCommand("setAutoPlay", { enabled: normalized });
      const message = normalized ? "คำสั่งเสียง: เปิดสลับหน้าอัตโนมัติ" : "คำสั่งเสียง: หยุดสลับหน้าอัตโนมัติ";
      setHint(message);
      setVoiceStatus(message);
      return true;
    }

    function sendVoiceWallMode(mode) {
      const normalized = storeWallModePreference(mode);
      renderModeButtons();
      sendCommand("setWallMode", { mode: normalized });
      const message = normalized === "wall" ? "คำสั่งเสียง: แสดง2จอ" : "คำสั่งเสียง: แสดง1จอ";
      setHint(message);
      setVoiceStatus(message);
      return true;
    }

    function sendVoiceSubPage(number) {
      if (!meta) return false;
      const total = Math.max(1, Number(meta.totalSubPages || 1));
      if (!number || number < 1 || number > total) return false;

      const page = getMainPage();
      sendCommand("goSubPage", {
        pageIndex: page ? page.index : 0,
        subIndex: Number(meta.currentMotherSubIndex || 0),
        subPageIndex: number - 1
      });
      const message = `คำสั่งเสียง: ไปหน้า ${number}`;
      setHint(message);
      setVoiceStatus(message);
      return true;
    }

    function handleVoiceCommand(rawText, options = {}) {
      const text = clean(rawText);
      if (!text) return false;

      const now = Date.now();
      const compact = compactVoiceText(text);
      if (!options.ignoreDedupe && compact && compact === lastVoiceCommandText && now - lastVoiceCommandAt < 1800) {
        return false;
      }

      // Only show transcript if it has trigger word
      if (hasVoiceCommandTrigger(text)) {
        setVoiceTranscript(text);
      }

      const finish = (ok) => {
        if (ok) {
          lastVoiceCommandText = compact;
          lastVoiceCommandAt = now;
        }
        return ok;
      };

      if (isBlockedVoiceText(text)) {
        setVoiceStatus(`ยังไม่สั่ง เพราะเหมือนประโยคคุยหรือคำถาม: ${text}`);
        return false;
      }

      if (!hasVoiceCommandTrigger(text)) {
        setVoiceStatus("ยังไม่สั่ง: ให้เริ่มด้วยคำว่า เปิด เช่น เปิดปาล์มใหญ่");
        return false;
      }

      if (voiceTextHasAlias(text, VOICE_ACTION_ALIASES[0])) {
        sendCommand("refresh");
        setHint("คำสั่งเสียง: รีเฟรชหน้าจอหลัก");
        setVoiceStatus("คำสั่งเสียง: รีเฟรชหน้าจอหลัก");
        return finish(true);
      }

      if (voiceTextHasAlias(text, VOICE_ACTION_ALIASES[1])) {
        return finish(sendVoiceAutoPlay(true));
      }

      if (voiceTextHasAlias(text, VOICE_ACTION_ALIASES[2])) {
        return finish(sendVoiceAutoPlay(false));
      }

      if (voiceTextHasAlias(text, VOICE_ACTION_ALIASES[3])) {
        return finish(sendVoiceWallMode("wall"));
      }

      if (voiceTextHasAlias(text, VOICE_ACTION_ALIASES[4])) {
        return finish(sendVoiceWallMode("single"));
      }

      if (voiceTextHasAlias(text, VOICE_ACTION_ALIASES[5])) {
        sendCommand("next");
        setHint("คำสั่งเสียง: ถัดไป");
        setVoiceStatus("คำสั่งเสียง: ถัดไป");
        return finish(true);
      }

      if (voiceTextHasAlias(text, VOICE_ACTION_ALIASES[6])) {
        sendCommand("prev");
        setHint("คำสั่งเสียง: ก่อนหน้า");
        setVoiceStatus("คำสั่งเสียง: ก่อนหน้า");
        return finish(true);
      }

      if (/ล้าง|ยกเลิกกรอง|แสดงทั้งหมด|ทุกสินค้า/.test(compact)) {
        clearProductFilterCommand();
        setVoiceStatus("คำสั่งเสียง: ล้างการกรองสินค้า");
        return finish(true);
      }

      if (/หมวดย่อย|กลุ่ม|ย่อย/.test(compact)) {
        const subCategory = findSubCategoryByVoice(text);
        const page = getMainPage();
        if (subCategory && page) {
          sendCommand("goSub", { pageIndex: page.index, subIndex: subCategory.index });
          const message = `คำสั่งเสียง: ${subCategory.name}`;
          setHint(message);
          setVoiceStatus(message);
          return finish(true);
        }
        // If subcategory not found, try navigation target
        const navTarget = findVoiceNavigationTarget(text);
        if (navTarget && navTarget.type === "sub") {
          return finish(sendVoiceNavigationTarget(navTarget));
        }
      }

      if (/หมวดหลัก|หมวด/.test(compact)) {
        const page = findMainPageByVoice(text);
        if (page) {
          sendCommand("goMain", { pageIndex: page.index });
          const message = `คำสั่งเสียง: หมวด ${page.index + 1}`;
          setHint(message);
          setVoiceStatus(message);
          return finish(true);
        }
      }

      const pageNumber = getVoiceNumberAfter(text, ["หน้าย่อย", "หน้า"]);
      if (pageNumber && sendVoiceSubPage(pageNumber)) {
        return finish(true);
      }

      const formulaQuery = extractFormulaFromVoice(text);
      if (formulaQuery && sendProductFilter(formulaQuery)) {
        setVoiceStatus(`คำสั่งเสียง: แสดงเฉพาะ ${formulaQuery}`);
        return finish(true);
      }

      if (sendVoiceNavigationTarget(findVoiceNavigationTarget(text))) {
        return finish(true);
      }

      const productQuery = getProductFilterQueryFromVoice(text);
      if (productQuery && sendProductFilter(productQuery)) {
        setVoiceStatus(`คำสั่งเสียง: แสดงเฉพาะ ${productQuery}`);
        return finish(true);
      }

      const remainder = getVoiceCommandRemainder(text);
      setVoiceStatus(remainder
        ? `ยังไม่รู้จักคำสั่ง: ${text} (เข้าใจเป็น: ${remainder})`
        : `ยังไม่รู้จักคำสั่ง: ${text}`);
      return false;
    }

    function ensureVoiceRecognition() {
      const Recognition = getSpeechRecognitionConstructor();
      if (!Recognition) return null;
      if (voiceRecognition) return voiceRecognition;

      const recognition = new Recognition();
      recognition.lang = "th-TH";
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 10;

      recognition.onstart = () => {
        setVoiceListeningState(true);
        setVoiceStatus("กำลังฟังคำสั่งเสียง... (รองรับภาษาไทยมาตรฐาน สำเนียงใต้อาจจับคำไม่ครบ)");
      };

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          const transcript = clean(result[0]?.transcript || "");
          
          if (!result.isFinal) {
            // Only show interim transcript if it has trigger word
            if (hasVoiceCommandTrigger(transcript)) {
              setVoiceTranscript(transcript);
            }
            continue;
          }

          let handled = false;
          for (let j = 0; j < result.length; j++) {
            const finalTranscript = clean(result[j]?.transcript || "");
            if (!finalTranscript) continue;
            if (handleVoiceCommand(finalTranscript, { ignoreDedupe: j > 0 })) {
              handled = true;
              break;
            }
          }

          if (!handled) {
            const fallback = clean(result[0]?.transcript || "");
            if (fallback) handleVoiceCommand(fallback, { ignoreDedupe: true });
          }
        }
      };

      recognition.onerror = (event) => {
        const error = clean(event?.error || "");
        if (error === "not-allowed" || error === "service-not-allowed") {
          setVoiceListeningState(false);
          setVoiceStatus("เปิดไมค์ไม่ได้ กรุณาอนุญาตไมโครโฟนในเบราว์เซอร์");
          return;
        }
        if (error === "no-speech") {
          setVoiceStatus("ยังไม่ได้ยินเสียง ลองพูดใหม่อีกครั้ง");
          return;
        }
        if (error === "aborted" && !voiceListening) return;
        setVoiceStatus(error ? `ระบบฟังเสียงมีปัญหา: ${error}` : "ระบบฟังเสียงมีปัญหา");
      };

      recognition.onend = () => {
        if (!voiceListening) {
          setVoiceListeningState(false);
          return;
        }

        clearTimeout(voiceRestartTimer);
        voiceRestartTimer = setTimeout(() => {
          try {
            recognition.start();
          } catch {}
        }, 450);
      };

      voiceRecognition = recognition;
      return voiceRecognition;
    }

    function startVoiceListening() {
      setVoicePanelOpen(true);
      const recognition = ensureVoiceRecognition();
      if (!recognition) {
        setVoiceListeningState(false);
        setVoiceStatus("เบราว์เซอร์นี้ยังไม่รองรับสั่งด้วยเสียง ให้เปิด control.html ด้วย Chrome หรือ Edge");
        return;
      }

      setVoiceListeningState(true);
      try {
        recognition.start();
      } catch {
        setVoiceStatus("ระบบฟังเสียงกำลังเริ่มอยู่");
      }
    }

    function stopVoiceListening() {
      clearTimeout(voiceRestartTimer);
      setVoiceListeningState(false);
      if (!voiceRecognition) {
        setVoiceStatus("หยุดฟังเสียงแล้ว");
        return;
      }

      try {
        voiceRecognition.stop();
      } catch {}
      setVoiceStatus("หยุดฟังเสียงแล้ว");
    }

    function initVoiceControls() {
      const btn = $("btnVoiceListen");
      const clearBtn = $("btnVoiceClear");
      const closeBtn = $("btnVoiceClose");
      const toggleBtn = $("btnVoiceToggle");
      if (!btn || !clearBtn) return;

      if (!getSpeechRecognitionConstructor()) {
        btn.disabled = true;
        btn.textContent = "ไม่รองรับเสียง";
        setVoiceStatus("เบราว์เซอร์นี้ยังไม่รองรับสั่งด้วยเสียง ให้ใช้ Chrome หรือ Edge");
      }

      if (toggleBtn) {
        toggleBtn.onclick = () => {
          setVoicePanelOpen(true);
          if (voiceListening) {
            stopVoiceListening();
          } else {
            startVoiceListening();
          }
        };
      }

      btn.onclick = () => {
        if (voiceListening) {
          stopVoiceListening();
        } else {
          startVoiceListening();
        }
      };

      clearBtn.onclick = () => {
        setVoiceTranscript("");
        setVoiceStatus(voiceListening ? "กำลังฟังคำสั่งเสียง..." : "กดปุ่มควบคุมด้วยเสียง แล้วพูดคำสั่ง");
      };

      if (closeBtn) {
        closeBtn.onclick = () => {
          if (voiceListening) stopVoiceListening();
          setVoicePanelOpen(false);
        };
      }
    }

    function readMetaLocal() {
      try {
        const raw = localStorage.getItem(CONTROL_META_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function readMetaRemote() {
      const endpoint = getWebAppUrl();
      if (!endpoint) return Promise.resolve(null);

      return runJsonp(endpoint, {
        mode: "pull_meta"
      }, 5000)
        .then((res) => {
          if (res && res.ok && res.meta) return res.meta;
          return null;
        })
        .catch(() => null);
    }

    function getMainPage() {
      if (!meta || !Array.isArray(meta.pages) || !meta.pages.length) return null;
      const currentIndex = Number(meta.currentPageIndex || 0);
      return meta.pages.find((page) => Number(page?.index) === currentIndex) || meta.pages[0];
    }

    function getCurrentSubCategory(page = getMainPage()) {
      const subCategories = Array.isArray(page?.subCategories) ? page.subCategories : [];
      const currentIndex = Number(meta?.currentMotherSubIndex || 0);
      return subCategories.find((item) => Number(item?.index) === currentIndex) || subCategories[0] || null;
    }

    function renderState() {
      const el = $("stateLine");
      if (!meta) {
        el.innerHTML = `<span class="muted">ยังไม่มีข้อมูลจากหน้าจอหลัก กรุณาเปิด index.html ไว้ก่อน</span>`;
        return;
      }
      const page = getMainPage();
      const pageName = page ? page.name : "-";
      const currentSubCategory = getCurrentSubCategory(page);
      const subName = currentSubCategory ? currentSubCategory.name : "-";
      const subPageText = `${(meta.currentSubPageIndex || 0) + 1}/${Math.max(1, meta.totalSubPages || 1)}`;
      const wallModeText = meta.wall
        ? (meta.wall.mode === "wall" || meta.wall.enabled
          ? `2 จอ (${Number(meta.wall.screen || 1)}/${Number(meta.wall.screens || 2)})`
          : "1 จอ")
        : "-";
      el.innerHTML = `
        <span class="state-item"><small>หมวด</small><b>${escapeHtml(pageName)}</b></span>
        <span class="state-item"><small>หมวดย่อย</small><b>${escapeHtml(subName)}</b></span>
        <span class="state-item"><small>หน้าย่อย</small><b>${escapeHtml(subPageText)}</b></span>
        <span class="state-item"><small>จำนวนสินค้า</small><b>${Number(meta.viewCount || 0)}</b></span>
        <span class="state-item"><small>โหมดแสดงจอ</small><b>${escapeHtml(wallModeText)}</b></span>
      `;
    }

    function formatTime(value) {
      const timestamp = Number(value || 0);
      if (!timestamp) return "-";
      return new Date(timestamp).toLocaleTimeString("th-TH", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
    }

    function formatAge(value) {
      const timestamp = Number(value || 0);
      if (!timestamp) return "-";
      const seconds = Math.max(0, Math.round((Date.now() - timestamp) / 1000));
      if (seconds < 60) return `${seconds} วินาทีที่แล้ว`;
      const minutes = Math.floor(seconds / 60);
      const remain = seconds % 60;
      return `${minutes} นาที ${remain} วินาทีที่แล้ว`;
    }

    function renderHealth() {
      const el = $("healthLine");
      const summary = $("healthSummary");

      if (!meta || !meta.health) {
        summary.textContent = "รอข้อมูลจอ";
        el.innerHTML = `<span class="muted">ยังไม่มี heartbeat จากทีวี</span>`;
        return;
      }

      const health = meta.health || {};
      const lastSeenAt = Number(health.lastSeenAt || meta.updatedAt || 0);
      const ageMs = lastSeenAt ? Date.now() - lastSeenAt : Infinity;
      const onlineState = ageMs <= 30000 ? "ok" : (ageMs <= 90000 ? "warn" : "bad");
      const onlineText = onlineState === "ok" ? "ออนไลน์" : (onlineState === "warn" ? "สัญญาณช้า" : "ออฟไลน์");
      const sheetState = health.lastSheetLoadOk ? "ok" : "bad";
      const sheetText = health.lastSheetLoadOk ? "โหลดสำเร็จ" : "โหลดมีปัญหา";

      summary.innerHTML = `<span class="health-dot ${onlineState}"></span>${escapeHtml(onlineText)}`;
      el.innerHTML = `
        <span class="health-item"><small>สถานะจอ</small><b><span class="health-dot ${onlineState}"></span>${escapeHtml(onlineText)}</b></span>
        <span class="health-item"><small>เห็นล่าสุด</small><b>${escapeHtml(formatAge(lastSeenAt))}</b></span>
        <span class="health-item"><small>โหลดชีตล่าสุด</small><b><span class="health-dot ${sheetState}"></span>${escapeHtml(sheetText)}</b></span>
        <span class="health-item"><small>เวลาโหลดชีต</small><b>${escapeHtml(formatTime(health.lastSheetLoadAt))}</b></span>
        <span class="health-item"><small>สินค้าบนจอ</small><b>${Number(health.displayedProductCount || 0)} รายการ</b></span>
        <span class="health-item"><small>ป้ายโปรบนจอ</small><b>${Number(health.specialBadgeCount || 0)} ป้าย</b></span>
        <span class="health-item"><small>ข้อมูลในเครื่อง</small><b>${health.cacheReady ? "พร้อม" : "ยังไม่พร้อม"}</b></span>
        <span class="health-item"><small>ข้อความล่าสุด</small><b>${escapeHtml(health.lastSheetLoadMessage || "-")}</b></span>
      `;
    }

    function getWallModeFromMeta() {
      if (!meta || !meta.wall) return readWallModePreference();
      return meta.wall.mode === "wall" || meta.wall.enabled ? "wall" : "single";
    }

    function getAutoPlayFromMeta() {
      if (isPendingAutoPlayActive()) return pendingAutoPlay.enabled;
      const fromMeta = getAutoPlayEnabledFromMeta();
      return fromMeta === null ? readAutoPlayPreference() : fromMeta;
    }

    function getProductFilterQueryFromMeta() {
      return clean(meta?.productFilter?.query || "");
    }

    function renderProductFilterControls() {
      const label = $("productFilterLabel");
      const input = $("productFilterInput");
      const query = getProductFilterQueryFromMeta();

      if (label) label.textContent = query ? `กรอง: ${query}` : "แสดงทุกสินค้า";
      if (input && document.activeElement !== input) input.value = query;
    }

    function sendProductFilter(query) {
      const normalized = clean(query);
      if (!normalized) {
        setHint("พิมพ์สูตรหรือชื่อสินค้าก่อน เช่น 15-10-30");
        return false;
      }

      sendCommand("filterProduct", { query: normalized });
      setHint(`แสดงเฉพาะสินค้า: ${normalized}`);
      return true;
    }

    function clearProductFilterCommand() {
      const input = $("productFilterInput");
      if (input) input.value = "";
      sendCommand("clearProductFilter");
      setHint("ล้างการกรองสินค้าแล้ว");
      renderProductFilterControls();
    }

    function renderModeButtons() {
      refreshWallOpenLinks();

      const mode = getWallModeFromMeta();
      const singleBtn = $("btnModeSingle");
      const wallBtn = $("btnModeWall");
      const label = $("wallModeLabel");

      singleBtn.classList.toggle("active", mode === "single");
      wallBtn.classList.toggle("active", mode === "wall");
      singleBtn.setAttribute("aria-pressed", mode === "single" ? "true" : "false");
      wallBtn.setAttribute("aria-pressed", mode === "wall" ? "true" : "false");

      if (!label) return;
      if (mode === "wall") {
        const screen = Number(meta?.wall?.screen || 0);
        const screens = Number(meta?.wall?.screens || 0);
        label.textContent = screen && screens ? `กำลังแสดง2จอ (${screen}/${screens})` : "เลือกแสดง2จอ";
      } else if (mode === "single") {
        label.textContent = meta?.wall ? "กำลังแสดง1จอ" : "เลือกแสดง1จอ";
      } else {
        label.textContent = "รอข้อมูลจอหลัก";
      }
    }

    function renderAutoPlayButtons() {
      return;
      const enabled = getAutoPlayFromMeta();
      const onBtn = $("btnAutoPlayOn");
      const offBtn = $("btnAutoPlayOff");
      const label = $("autoPlayLabel");

      onBtn.classList.toggle("active", enabled === true);
      offBtn.classList.toggle("active", enabled === false);
      onBtn.setAttribute("aria-pressed", enabled === true ? "true" : "false");
      offBtn.setAttribute("aria-pressed", enabled === false ? "true" : "false");

      if (!label) return;
      if (!meta && !isPendingAutoPlayActive()) {
        label.textContent = enabled ? "ตั้งค่าเปิดไว้ในเครื่องนี้" : "ตั้งค่าหยุดไว้ในเครื่องนี้";
      } else {
        label.textContent = enabled ? "กำลังสลับหน้าอัตโนมัติ" : "หยุดสลับหน้าอัตโนมัติ";
      }
    }

    function renderMainButtons() {
      const grid = $("mainGrid");
      grid.innerHTML = "";
      if (!meta || !Array.isArray(meta.pages)) return;

      meta.pages.forEach((p) => {
        const btn = document.createElement("button");
        btn.className = "btn" + (p.index === meta.currentPageIndex ? " active" : "");
        btn.textContent = `${p.index + 1}. ${p.name}`;
        btn.onclick = () => sendCommand("goMain", { pageIndex: p.index });
        grid.appendChild(btn);
      });
    }

    function renderSubButtons() {
      const grid = $("subGrid");
      grid.innerHTML = "";
      const page = getMainPage();
      if (!page) return;

      const subCategories = Array.isArray(page.subCategories) ? page.subCategories : [];
      if (!subCategories.length) {
        const d = document.createElement("div");
        d.className = "muted";
        d.textContent = "หมวดนี้ไม่มีหมวดย่อย";
        grid.appendChild(d);
        return;
      }

      subCategories.forEach((s) => {
        const btn = document.createElement("button");
        btn.className = "btn" + (s.index === meta.currentMotherSubIndex ? " active" : "");
        btn.textContent = `${s.index + 1}. ${s.name}`;
        btn.onclick = () => sendCommand("goSub", { pageIndex: page.index, subIndex: s.index });
        grid.appendChild(btn);
      });
    }

    function renderSubPageButtons() {
      const grid = $("subPageGrid");
      grid.innerHTML = "";
      if (!meta) return;
      const total = Math.max(1, Number(meta.totalSubPages || 1));
      const page = getMainPage();
      const pageIndex = page ? page.index : 0;
      const subIndex = Number(meta.currentMotherSubIndex || 0);

      for (let i = 0; i < total; i++) {
        const btn = document.createElement("button");
        btn.className = "btn" + (i === Number(meta.currentSubPageIndex || 0) ? " active" : "");
        btn.textContent = `หน้า ${i + 1}`;
        btn.onclick = () => sendCommand("goSubPage", {
          pageIndex,
          subIndex,
          subPageIndex: i
        });
        grid.appendChild(btn);
      }
    }

    function render() {
      renderState();
      renderHealth();
      renderProductFilterControls();
      renderModeButtons();
      renderMainButtons();
      renderSubButtons();
      renderSubPageButtons();
    }

    function restartRemoteMetaPolling() {
      if (remoteMetaTimer) clearInterval(remoteMetaTimer);
      const endpoint = getWebAppUrl();
      if (!endpoint) return;

      const tick = () => {
        if (remoteMetaPollInFlight) return;
        remoteMetaPollInFlight = true;

        readMetaRemote().then((remoteMeta) => {
          if (remoteMeta) {
            applyMeta(remoteMeta);
            setHint("เชื่อมต่อ GAS แล้ว");
          }
        }).finally(() => {
          remoteMetaPollInFlight = false;
        });
      };
      tick();
      remoteMetaTimer = setInterval(tick, REMOTE_META_POLL_MS);
    }

    function reloadMeta() {
      const localMeta = readMetaLocal();
      if (localMeta) {
        applyMeta(localMeta);
      }

      readMetaRemote().then((remoteMeta) => {
        if (remoteMeta) {
          applyMeta(remoteMeta);
          setHint("เชื่อมต่อ GAS แล้ว");
        } else {
          if (!getWebAppUrl()) {
            setHint("ยังไม่ตั้งค่า GAS URL");
          } else {
            setHint("ยังดึงข้อมูลจาก GAS ไม่ได้ (ตรวจ URL/สิทธิ์ Deploy)");
          }
        }
      });
    }

    $("btnPrev").onclick = () => sendCommand("prev");
    $("btnNext").onclick = () => sendCommand("next");
    $("btnRefresh").onclick = () => {
      sendCommand("refresh");
      setHint("ส่งคำสั่งรีเฟรชแล้ว");
    };
    $("btnProductFilter").onclick = () => sendProductFilter($("productFilterInput").value);
    $("btnClearProductFilter").onclick = clearProductFilterCommand;
    $("productFilterInput").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      sendProductFilter(event.currentTarget.value);
    });
    $("btnReloadMeta").onclick = reloadMeta;
    $("btnToggleHealth").onclick = toggleHealthCollapsed;
    $("btnModeSingle").onclick = () => {
      storeWallModePreference("single");
      renderModeButtons();
      sendCommand("setWallMode", { mode: "single" });
      setHint("สั่งแสดง1จอแล้ว");
    };
    $("btnModeWall").onclick = () => {
      storeWallModePreference("wall");
      renderModeButtons();
      sendCommand("setWallMode", { mode: "wall" });
      setHint("สั่งแสดง2จอแล้ว");
    };
    $("btnSaveGasUrl").onclick = () => {
      const url = clean($("gasUrlInput").value);
      if (!validWebAppUrl(url)) {
        setHint("URL ไม่ถูกต้อง (ต้องขึ้นต้นด้วย https://script.google.com/)");
        return;
      }
      try {
        localStorage.setItem(CONTROL_WEBAPP_KEY, url);
      } catch {}
      try {
        const rawMain = localStorage.getItem(STORAGE_KEY);
        const parsed = rawMain ? JSON.parse(rawMain) : {};
        parsed.controlWebAppUrl = url;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
      } catch {}
      setHint("บันทึก GAS URL แล้ว");
      restartRemoteMetaPolling();
      reloadMeta();
    };

    window.addEventListener("storage", (event) => {
      if (event.key === CONTROL_META_KEY) reloadMeta();
    });

    (function init() {
      applyHealthCollapsed(readHealthCollapsedPreference());
      const saved = getWebAppUrl();
      const gasUrlInput = $("gasUrlInput");
      if (saved && gasUrlInput) gasUrlInput.value = saved;
      restartRemoteMetaPolling();
      reloadMeta();
      startVersionCheck();
    })();
  </script>
</body>
</html>
