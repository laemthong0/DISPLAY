<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Control Panel - Display</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf3f0;
      --card: #ffffff;
      --line: #cfd9d4;
      --text: #14231b;
      --muted: #64746d;
      --brand: #155f38;
      --brand-2: #1f7a49;
      --brand-soft: #e5f4eb;
      --danger: #b42318;
      --shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }
    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 840px;
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 1px 0 rgba(16, 24, 40, 0.03);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-header {
      position: sticky;
      top: max(8px, env(safe-area-inset-top));
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(207, 217, 212, 0.9);
      border-radius: 8px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.15rem, 4.7vw, 1.6rem);
      color: var(--brand);
      line-height: 1.18;
    }

    .muted {
      color: var(--muted);
      font-size: clamp(0.9rem, 3.2vw, 1rem);
      line-height: 1.3;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 1.02rem;
      font-weight: 800;
    }

    .section-title .muted {
      font-weight: 600;
      text-align: right;
    }

    .btn {
      border: 1px solid #c7d0da;
      background: #fff;
      color: #1d2a36;
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: clamp(1rem, 3.7vw, 1.16rem);
      line-height: 1.12;
      min-height: 56px;
      box-shadow: 0 1px 0 rgba(16, 24, 40, 0.04);
      transition: background 120ms ease, transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      touch-action: manipulation;
      user-select: none;
    }

    .btn:hover {
      background: #f2f6fa;
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(16, 24, 40, 0.09);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .btn.primary {
      border-color: #1f6f43;
      background: var(--brand);
      color: #fff;
    }

    .btn.primary:hover { background: var(--brand-2); }

    .btn.secondary {
      border-color: #b9c7c0;
      background: #f7faf8;
    }

    .btn.utility {
      min-height: 48px;
      padding-inline: 13px;
      font-size: 0.98rem;
    }

    .btn.active {
      border-color: var(--brand);
      box-shadow: inset 0 0 0 2px var(--brand), 0 2px 8px rgba(31, 111, 67, 0.16);
      background: var(--brand-soft);
      color: #0f5132;
    }

    .mode-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .mode-actions .btn {
      min-height: 74px;
      font-size: clamp(1.2rem, 5vw, 1.55rem);
      font-weight: 900;
    }

    .transport-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    #btnPrev,
    #btnNext {
      min-width: 0;
      min-height: clamp(84px, 23vw, 112px);
      font-size: clamp(1.32rem, 6vw, 1.9rem);
      font-weight: 900;
    }

    #btnRefresh {
      width: 100%;
      margin-top: 8px;
      min-height: 62px;
      font-weight: 800;
    }

    #btnAutoToggle {
      width: 100%;
      margin-top: 8px;
      min-height: 70px;
      font-size: clamp(1.18rem, 5vw, 1.45rem);
      font-weight: 900;
    }

    #btnAutoToggle.paused {
      border-color: #b42318;
      background: #fff1f0;
      color: #912018;
      box-shadow: inset 0 0 0 2px rgba(180, 35, 24, 0.28);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .grid .btn {
      min-height: 80px;
      height: 100%;
      font-size: clamp(1.02rem, 4.1vw, 1.24rem);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: normal;
      line-height: 1.18;
      padding: 10px;
      font-weight: 800;
      word-break: break-word;
    }

    #mainGrid .btn {
      min-height: 92px;
      font-size: clamp(1.08rem, 4.6vw, 1.36rem);
    }

    #subGrid .btn {
      min-height: 76px;
    }

    #subPageGrid {
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    }

    #subPageGrid .btn {
      min-height: 60px;
      font-size: 1rem;
    }

    .state {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      font-size: 1rem;
    }

    .state-item {
      min-width: 0;
      border: 1px solid #dbe5df;
      border-radius: 8px;
      padding: 10px;
      background: #f8fbf9;
    }

    .state-item small {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 5px;
    }

    .state-item b {
      display: block;
      color: #0f5132;
      font-size: clamp(1rem, 3.8vw, 1.18rem);
      line-height: 1.22;
      overflow-wrap: anywhere;
    }

    .health-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .health-item {
      min-width: 0;
      border: 1px solid #dbe5df;
      border-radius: 8px;
      padding: 10px;
      background: #f8fbf9;
    }

    .health-item small {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .health-item b {
      display: block;
      color: #0f5132;
      font-size: clamp(1rem, 3.8vw, 1.18rem);
      line-height: 1.22;
      overflow-wrap: anywhere;
    }

    .health-dot {
      display: inline-block;
      width: 0.72em;
      height: 0.72em;
      border-radius: 999px;
      margin-right: 6px;
      background: #9aa7a0;
      box-shadow: 0 0 0 3px rgba(154, 167, 160, 0.14);
      vertical-align: middle;
    }

    .health-dot.ok {
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.16);
    }

    .health-dot.warn {
      background: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.16);
    }

    .health-dot.bad {
      background: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.16);
    }

    .gas-config {
      display: none !important;
    }

    @media (min-width: 720px) {
      .wrap {
        gap: 12px;
      }

      .card {
        padding: 14px;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
      }

      .state {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      body {
        padding-left: max(8px, env(safe-area-inset-left));
        padding-right: max(8px, env(safe-area-inset-right));
      }

      .wrap {
        gap: 8px;
      }

      .control-header {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 10px;
      }

      .control-header .btn {
        width: 100%;
      }

      .btn {
        min-height: 58px;
      }

      .section-title {
        align-items: flex-start;
        flex-direction: column;
        gap: 3px;
      }

      .section-title .muted {
        text-align: left;
      }
    }

    @media (max-width: 360px) {
      .transport-grid,
      .mode-actions,
      .grid,
      .state,
      .health-grid {
        grid-template-columns: 1fr;
      }

      #btnPrev,
      #btnNext {
        min-height: 76px;
      }

      #mainGrid .btn,
      #subGrid .btn {
        min-height: 70px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="control-header">
      <div>
        <h1>หน้าเว็บควบคุมจอแสดงสินค้า</h1>
        <div class="muted" id="connHint">ใช้ควบคุมข้ามอุปกรณ์ผ่าน Google Apps Script Web App</div>
      </div>
      <button class="btn utility" id="btnReloadMeta">รีโหลดข้อมูล</button>
      <div class="row gas-config" style="margin-top:8px;">
        <input id="gasUrlInput" type="text" placeholder="Google Apps Script Web App URL (https://script.google.com/macros/s/.../exec)" style="flex:1;min-width:320px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;">
        <button class="btn" id="btnSaveGasUrl">บันทึก URL</button>
      </div>
    </header>

    <div class="card">
      <div class="section-title">
        <b>สถานะปัจจุบัน</b>
      </div>
      <div class="state" id="stateLine"></div>
    </div>

    <div class="card">
      <div class="section-title">
        <b>Health Check ทีวี</b>
        <span class="muted" id="healthSummary">รอข้อมูลจอ</span>
      </div>
      <div class="health-grid" id="healthLine"></div>
    </div>

    <div class="card">
      <div class="section-title">
        <b>โหมดแสดงจอ</b>
        <span class="muted" id="wallModeLabel">รอข้อมูลจอหลัก</span>
      </div>
      <div class="mode-actions">
        <button class="btn" id="btnModeSingle">แสดง1จอ</button>
        <button class="btn" id="btnModeWall">แสดง2จอ</button>
      </div>
    </div>

    <div class="card">
      <div class="transport-grid">
        <button class="btn" id="btnPrev">ก่อนหน้า</button>
        <button class="btn" id="btnNext">ถัดไป</button>
      </div>
      <button class="btn secondary" id="btnRefresh">รีเฟรชหน้าจอหลัก</button>
      <button class="btn" id="btnAutoToggle">หยุดออโต้</button>
    </div>

    <div class="card">
      <div class="section-title">
        <b>หมวดหลัก</b>
      </div>
      <div class="grid" id="mainGrid"></div>
    </div>

    <div class="card">
      <div class="section-title">
        <b>หมวดย่อยของหมวดที่เลือก</b>
      </div>
      <div class="grid" id="subGrid"></div>
    </div>

    <div class="card">
      <div class="section-title">
        <b>หน้าย่อย (กรณีเกิน 21 รายการ)</b>
      </div>
      <div class="grid" id="subPageGrid"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "tv-price-display-modern-premium-v9";
    const CONTROL_COMMAND_KEY = "tv-display-control-command-v1";
    const CONTROL_META_KEY = "tv-display-control-meta-v1";
    const CONTROL_WEBAPP_KEY = "tv-display-control-webapp-url";
    const CONTROL_CHANNEL_NAME = "tv-display-control-channel-v1";
    const WALL_MODE_KEY = "tv-display-wall-mode-v1";
    const AUTO_PLAY_KEY = "tv-display-auto-play-v1";
    const DEFAULT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxxcQZih3EeXbBoBVv9faUUFJ3b9CZaRG70enizHyo-2lNfTbSTDirCo0Txwq9fy_h83g/exec";
    const REMOTE_META_POLL_MS = 900;
    const AUTO_PLAY_PENDING_MS = 7000;

    const $ = (id) => document.getElementById(id);

    let meta = null;
    let remoteMetaTimer = null;
    let controlBroadcastChannel = null;
    let pendingAutoPlay = null;
    let autoPlayAckTimer = null;

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>\"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[m]));
    }

    function clean(val) {
      return String(val ?? "").trim();
    }

    function validWebAppUrl(url) {
      return /^https:\/\/script\.google\.com\//i.test(clean(url));
    }

    function getWebAppUrl() {
      const fromInput = clean($("gasUrlInput").value);
      if (validWebAppUrl(fromInput)) return fromInput;

      const fromLocal = clean(localStorage.getItem(CONTROL_WEBAPP_KEY) || "");
      if (validWebAppUrl(fromLocal)) return fromLocal;

      try {
        const rawMain = localStorage.getItem(STORAGE_KEY);
        const parsed = rawMain ? JSON.parse(rawMain) : null;
        const fromMain = clean(parsed?.controlWebAppUrl || "");
        if (validWebAppUrl(fromMain)) return fromMain;
      } catch {}

      if (validWebAppUrl(DEFAULT_WEBAPP_URL)) return DEFAULT_WEBAPP_URL;

      return "";
    }

    function setHint(text) {
      $("connHint").textContent = text;
    }

    function storeWallModePreference(mode) {
      const normalized = clean(mode).toLowerCase() === "wall" ? "wall" : "single";

      try {
        localStorage.setItem(WALL_MODE_KEY, normalized);
      } catch {}

      return normalized;
    }

    function readWallModePreference() {
      try {
        const mode = clean(localStorage.getItem(WALL_MODE_KEY)).toLowerCase();
        return mode === "single" || mode === "wall" ? mode : "";
      } catch {
        return "";
      }
    }

    function storeAutoPlayPreference(enabled) {
      const isEnabled = enabled !== false;

      try {
        localStorage.setItem(AUTO_PLAY_KEY, isEnabled ? "running" : "paused");
      } catch {}

      return isEnabled;
    }

    function readAutoPlayPreference() {
      try {
        const mode = clean(localStorage.getItem(AUTO_PLAY_KEY)).toLowerCase();
        return mode !== "paused" && mode !== "0" && mode !== "false" && mode !== "off";
      } catch {
        return true;
      }
    }

    function getAutoPlayEnabledFromMeta(metaPayload = meta) {
      if (!metaPayload || !metaPayload.autoPlay) return null;
      return metaPayload.autoPlay.enabled !== false;
    }

    function isPendingAutoPlayActive() {
      return pendingAutoPlay && Date.now() - pendingAutoPlay.at < AUTO_PLAY_PENDING_MS;
    }

    function clearAutoPlayAckTimer() {
      if (autoPlayAckTimer) {
        clearTimeout(autoPlayAckTimer);
        autoPlayAckTimer = null;
      }
    }

    function scheduleAutoPlayAckCheck() {
      clearAutoPlayAckTimer();
      autoPlayAckTimer = setTimeout(() => {
        autoPlayAckTimer = null;
        if (!isPendingAutoPlayActive()) {
          pendingAutoPlay = null;
          render();
        }
      }, AUTO_PLAY_PENDING_MS + 150);
    }

    function setPendingAutoPlay(enabled) {
      pendingAutoPlay = {
        enabled: enabled !== false,
        at: Date.now()
      };
      scheduleAutoPlayAckCheck();
    }

    function applyMeta(nextMeta) {
      if (!nextMeta) return;

      const metaAutoPlay = getAutoPlayEnabledFromMeta(nextMeta);
      if (pendingAutoPlay) {
        if (metaAutoPlay === pendingAutoPlay.enabled) {
          pendingAutoPlay = null;
          clearAutoPlayAckTimer();
        } else if (isPendingAutoPlayActive()) {
          // Keep the real meta, but render the pending user command until the TV confirms it.
        } else {
          pendingAutoPlay = null;
          clearAutoPlayAckTimer();
        }
      }

      meta = nextMeta;
      render();
    }

    function postLocalCommand(cmd) {
      try {
        localStorage.setItem(CONTROL_COMMAND_KEY, JSON.stringify(cmd));
      } catch {}

      try {
        if (!controlBroadcastChannel && "BroadcastChannel" in window) {
          controlBroadcastChannel = new BroadcastChannel(CONTROL_CHANNEL_NAME);
        }
        if (controlBroadcastChannel) controlBroadcastChannel.postMessage(cmd);
      } catch {
        controlBroadcastChannel = null;
      }
    }

    function runJsonp(url, params = {}, timeoutMs = 5000) {
      return new Promise((resolve, reject) => {
        const callbackName = `ctrlJsonp_${Date.now()}_${Math.random().toString(16).slice(2, 8)}`;
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("timeout"));
        }, timeoutMs);

        const cleanup = () => {
          clearTimeout(timer);
          if (window[callbackName]) delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        };

        const u = new URL(url);
        Object.entries(params).forEach(([k, v]) => {
          if (v !== undefined && v !== null) u.searchParams.set(k, String(v));
        });
        u.searchParams.set("callback", callbackName);
        u.searchParams.set("_ts", String(Date.now()));

        window[callbackName] = (payload) => {
          cleanup();
          resolve(payload);
        };

        script.src = u.toString();
        script.onerror = () => {
          cleanup();
          reject(new Error("failed"));
        };
        document.body.appendChild(script);
      });
    }

    function sendCommand(action, extra = {}) {
      const cmd = {
        id: `${Date.now()}-${Math.random().toString(16).slice(2, 8)}`,
        action,
        ...extra
      };

      postLocalCommand(cmd);

      const endpoint = getWebAppUrl();
      if (!endpoint) return;
      const payload = JSON.stringify({
        mode: "push_command",
        source: "control",
        command: cmd
      });

      const isCurrentAutoPlayCommand = () => {
        if (action !== "setAutoPlay") return true;
        return readAutoPlayPreference() === (cmd.enabled !== false);
      };

      const sendOnce = () => {
        if (!isCurrentAutoPlayCommand()) return;

        try {
          if (navigator.sendBeacon) {
            const blob = new Blob([payload], { type: "text/plain;charset=utf-8" });
            if (navigator.sendBeacon(endpoint, blob)) return;
          }
        } catch {}

        try {
          fetch(endpoint, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: payload
          }).catch(() => {});
        } catch {}
      };

      // Retry short bursts to reduce dropped commands over remote network.
      const highReliabilityAction = action === "refresh" || action === "setAutoPlay";
      const retryDelays = highReliabilityAction
        ? [0, 120, 300, 700, 1200, 2000, 3200]
        : [0, 120, 260, 700, 1200];

      retryDelays.forEach((delay) => {
        if (delay === 0) {
          sendOnce();
        } else {
          setTimeout(sendOnce, delay);
        }
      });

      if (highReliabilityAction) {
        // Some locked-down TV browsers miss one storage event; repeat local delivery with a fresh wrapper.
        [180, 520, 1100].forEach((delay) => {
          setTimeout(() => {
            if (isCurrentAutoPlayCommand()) {
              postLocalCommand({ ...cmd, id: `${cmd.id}-local-${delay}` });
            }
          }, delay);
        });
      }
    }

    function readMetaLocal() {
      try {
        const raw = localStorage.getItem(CONTROL_META_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function readMetaRemote() {
      const endpoint = getWebAppUrl();
      if (!endpoint) return Promise.resolve(null);

      return runJsonp(endpoint, { mode: "pull_meta" }, 5000)
        .then((res) => {
          if (res && res.ok && res.meta) return res.meta;
          return null;
        })
        .catch(() => null);
    }

    function getMainPage() {
      if (!meta || !Array.isArray(meta.pages) || !meta.pages.length) return null;
      return meta.pages[meta.currentPageIndex] || meta.pages[0];
    }

    function renderState() {
      const el = $("stateLine");
      if (!meta) {
        el.innerHTML = `<span class="muted">ยังไม่มีข้อมูลจากหน้าจอหลัก กรุณาเปิด index.html ไว้ก่อน</span>`;
        return;
      }
      const page = getMainPage();
      const pageName = page ? page.name : "-";
      const subName = (page && page.subCategories && page.subCategories[meta.currentMotherSubIndex])
        ? page.subCategories[meta.currentMotherSubIndex].name
        : "-";
      const subPageText = `${(meta.currentSubPageIndex || 0) + 1}/${Math.max(1, meta.totalSubPages || 1)}`;
      const wallModeText = meta.wall
        ? (meta.wall.mode === "wall" || meta.wall.enabled
          ? `2 จอ (${Number(meta.wall.screen || 1)}/${Number(meta.wall.screens || 2)})`
          : "1 จอ")
        : "-";
      const autoPlayEnabled = getAutoPlayFromMeta();
      const autoPlayText = isPendingAutoPlayActive()
        ? (autoPlayEnabled ? "กำลังเปิด" : "กำลังหยุด")
        : (autoPlayEnabled ? "เปิด" : "หยุด");
      el.innerHTML = `
        <span class="state-item"><small>หมวด</small><b>${escapeHtml(pageName)}</b></span>
        <span class="state-item"><small>หมวดย่อย</small><b>${escapeHtml(subName)}</b></span>
        <span class="state-item"><small>หน้าย่อย</small><b>${escapeHtml(subPageText)}</b></span>
        <span class="state-item"><small>จำนวนสินค้า</small><b>${Number(meta.viewCount || 0)}</b></span>
        <span class="state-item"><small>โหมดแสดงจอ</small><b>${escapeHtml(wallModeText)}</b></span>
        <span class="state-item"><small>ออโต้</small><b>${escapeHtml(autoPlayText)}</b></span>
      `;
    }

    function formatTime(value) {
      const timestamp = Number(value || 0);
      if (!timestamp) return "-";
      return new Date(timestamp).toLocaleTimeString("th-TH", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
    }

    function formatAge(value) {
      const timestamp = Number(value || 0);
      if (!timestamp) return "-";
      const seconds = Math.max(0, Math.round((Date.now() - timestamp) / 1000));
      if (seconds < 60) return `${seconds} วินาทีที่แล้ว`;
      const minutes = Math.floor(seconds / 60);
      const remain = seconds % 60;
      return `${minutes} นาที ${remain} วินาทีที่แล้ว`;
    }

    function renderHealth() {
      const el = $("healthLine");
      const summary = $("healthSummary");

      if (!meta || !meta.health) {
        summary.textContent = "รอข้อมูลจอ";
        el.innerHTML = `<span class="muted">ยังไม่มี heartbeat จากทีวี</span>`;
        return;
      }

      const health = meta.health || {};
      const lastSeenAt = Number(health.lastSeenAt || meta.updatedAt || 0);
      const ageMs = lastSeenAt ? Date.now() - lastSeenAt : Infinity;
      const onlineState = ageMs <= 30000 ? "ok" : (ageMs <= 90000 ? "warn" : "bad");
      const onlineText = onlineState === "ok" ? "ออนไลน์" : (onlineState === "warn" ? "สัญญาณช้า" : "ออฟไลน์");
      const sheetState = health.lastSheetLoadOk ? "ok" : "bad";
      const sheetText = health.lastSheetLoadOk ? "โหลดสำเร็จ" : "โหลดมีปัญหา";

      summary.innerHTML = `<span class="health-dot ${onlineState}"></span>${escapeHtml(onlineText)}`;
      el.innerHTML = `
        <span class="health-item"><small>สถานะจอ</small><b><span class="health-dot ${onlineState}"></span>${escapeHtml(onlineText)}</b></span>
        <span class="health-item"><small>เห็นล่าสุด</small><b>${escapeHtml(formatAge(lastSeenAt))}</b></span>
        <span class="health-item"><small>โหลดชีตล่าสุด</small><b><span class="health-dot ${sheetState}"></span>${escapeHtml(sheetText)}</b></span>
        <span class="health-item"><small>เวลาโหลดชีต</small><b>${escapeHtml(formatTime(health.lastSheetLoadAt))}</b></span>
        <span class="health-item"><small>สินค้าบนจอ</small><b>${Number(health.displayedProductCount || 0)} รายการ</b></span>
        <span class="health-item"><small>ป้ายโปรบนจอ</small><b>${Number(health.specialBadgeCount || 0)} ป้าย</b></span>
        <span class="health-item"><small>ข้อมูลในเครื่อง</small><b>${health.cacheReady ? "พร้อม" : "ยังไม่พร้อม"}</b></span>
        <span class="health-item"><small>ข้อความล่าสุด</small><b>${escapeHtml(health.lastSheetLoadMessage || "-")}</b></span>
      `;
    }

    function getWallModeFromMeta() {
      if (!meta || !meta.wall) return readWallModePreference();
      return meta.wall.mode === "wall" || meta.wall.enabled ? "wall" : "single";
    }

    function getAutoPlayFromMeta() {
      if (isPendingAutoPlayActive()) return pendingAutoPlay.enabled;
      const fromMeta = getAutoPlayEnabledFromMeta();
      return fromMeta === null ? readAutoPlayPreference() : fromMeta;
    }

    function renderModeButtons() {
      const mode = getWallModeFromMeta();
      const singleBtn = $("btnModeSingle");
      const wallBtn = $("btnModeWall");
      const label = $("wallModeLabel");

      singleBtn.classList.toggle("active", mode === "single");
      wallBtn.classList.toggle("active", mode === "wall");
      singleBtn.setAttribute("aria-pressed", mode === "single" ? "true" : "false");
      wallBtn.setAttribute("aria-pressed", mode === "wall" ? "true" : "false");

      if (!label) return;
      if (mode === "wall") {
        const screen = Number(meta?.wall?.screen || 0);
        const screens = Number(meta?.wall?.screens || 0);
        label.textContent = screen && screens ? `กำลังแสดง2จอ (${screen}/${screens})` : "เลือกแสดง2จอ";
      } else if (mode === "single") {
        label.textContent = meta?.wall ? "กำลังแสดง1จอ" : "เลือกแสดง1จอ";
      } else {
        label.textContent = "รอข้อมูลจอหลัก";
      }
    }

    function renderAutoButton() {
      const enabled = getAutoPlayFromMeta();
      const btn = $("btnAutoToggle");
      if (!btn) return;

      btn.textContent = enabled ? "หยุดออโต้" : "เล่นออโต้";
      btn.classList.toggle("paused", !enabled);
      btn.classList.toggle("active", !enabled);
      btn.setAttribute("aria-pressed", enabled ? "false" : "true");
      btn.setAttribute("aria-busy", isPendingAutoPlayActive() ? "true" : "false");
    }

    function renderMainButtons() {
      const grid = $("mainGrid");
      grid.innerHTML = "";
      if (!meta || !Array.isArray(meta.pages)) return;

      meta.pages.forEach((p) => {
        const btn = document.createElement("button");
        btn.className = "btn" + (p.index === meta.currentPageIndex ? " active" : "");
        btn.textContent = `${p.index + 1}. ${p.name}`;
        btn.onclick = () => sendCommand("goMain", { pageIndex: p.index });
        grid.appendChild(btn);
      });
    }

    function renderSubButtons() {
      const grid = $("subGrid");
      grid.innerHTML = "";
      const page = getMainPage();
      if (!page) return;

      const subCategories = Array.isArray(page.subCategories) ? page.subCategories : [];
      if (!subCategories.length) {
        const d = document.createElement("div");
        d.className = "muted";
        d.textContent = "หมวดนี้ไม่มีหมวดย่อย";
        grid.appendChild(d);
        return;
      }

      subCategories.forEach((s) => {
        const btn = document.createElement("button");
        btn.className = "btn" + (s.index === meta.currentMotherSubIndex ? " active" : "");
        btn.textContent = `${s.index + 1}. ${s.name}`;
        btn.onclick = () => sendCommand("goSub", { pageIndex: page.index, subIndex: s.index });
        grid.appendChild(btn);
      });
    }

    function renderSubPageButtons() {
      const grid = $("subPageGrid");
      grid.innerHTML = "";
      if (!meta) return;
      const total = Math.max(1, Number(meta.totalSubPages || 1));
      const page = getMainPage();
      const pageIndex = page ? page.index : 0;
      const subIndex = Number(meta.currentMotherSubIndex || 0);

      for (let i = 0; i < total; i++) {
        const btn = document.createElement("button");
        btn.className = "btn" + (i === Number(meta.currentSubPageIndex || 0) ? " active" : "");
        btn.textContent = `หน้า ${i + 1}`;
        btn.onclick = () => sendCommand("goSubPage", {
          pageIndex,
          subIndex,
          subPageIndex: i
        });
        grid.appendChild(btn);
      }
    }

    function render() {
      renderState();
      renderHealth();
      renderModeButtons();
      renderAutoButton();
      renderMainButtons();
      renderSubButtons();
      renderSubPageButtons();
    }

    function restartRemoteMetaPolling() {
      if (remoteMetaTimer) clearInterval(remoteMetaTimer);
      const endpoint = getWebAppUrl();
      if (!endpoint) return;

      const tick = () => {
        readMetaRemote().then((remoteMeta) => {
          if (remoteMeta) {
            applyMeta(remoteMeta);
            setHint("เชื่อมต่อ GAS แล้ว");
          }
        });
      };
      tick();
      remoteMetaTimer = setInterval(tick, REMOTE_META_POLL_MS);
    }

    function reloadMeta() {
      const localMeta = readMetaLocal();
      if (localMeta) {
        applyMeta(localMeta);
      }

      readMetaRemote().then((remoteMeta) => {
        if (remoteMeta) {
          applyMeta(remoteMeta);
          setHint("เชื่อมต่อ GAS แล้ว");
        } else {
          if (!getWebAppUrl()) {
            setHint("ยังไม่ตั้งค่า GAS URL");
          } else {
            setHint("ยังดึงข้อมูลจาก GAS ไม่ได้ (ตรวจ URL/สิทธิ์ Deploy)");
          }
        }
      });
    }

    $("btnPrev").onclick = () => sendCommand("prev");
    $("btnNext").onclick = () => sendCommand("next");
    $("btnRefresh").onclick = () => {
      sendCommand("refresh");
      setHint("ส่งคำสั่งรีเฟรชแล้ว");
    };
    $("btnReloadMeta").onclick = reloadMeta;
    $("btnAutoToggle").onclick = () => {
      const nextEnabled = !getAutoPlayFromMeta();
      setPendingAutoPlay(nextEnabled);
      storeAutoPlayPreference(nextEnabled);
      render();
      sendCommand("setAutoPlay", { enabled: nextEnabled });
      setHint(nextEnabled ? "สั่งเล่นออโต้แล้ว" : "สั่งหยุดออโต้แล้ว");
    };
    $("btnModeSingle").onclick = () => {
      storeWallModePreference("single");
      renderModeButtons();
      sendCommand("setWallMode", { mode: "single" });
      setHint("สั่งแสดง1จอแล้ว");
    };
    $("btnModeWall").onclick = () => {
      storeWallModePreference("wall");
      renderModeButtons();
      sendCommand("setWallMode", { mode: "wall" });
      setHint("สั่งแสดง2จอแล้ว");
    };

    $("btnSaveGasUrl").onclick = () => {
      const url = clean($("gasUrlInput").value);
      if (!validWebAppUrl(url)) {
        setHint("URL ไม่ถูกต้อง (ต้องขึ้นต้นด้วย https://script.google.com/)");
        return;
      }
      localStorage.setItem(CONTROL_WEBAPP_KEY, url);
      setHint("บันทึก GAS URL แล้ว");
      restartRemoteMetaPolling();
      reloadMeta();
    };

    window.addEventListener("storage", (event) => {
      if (event.key === CONTROL_META_KEY) reloadMeta();
    });

    (function init() {
      const saved = getWebAppUrl();
      if (saved) $("gasUrlInput").value = saved;
      restartRemoteMetaPolling();
      reloadMeta();
    })();
  </script>
</body>
</html>
