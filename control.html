<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Control Panel - Display</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf3f0;
      --card: #ffffff;
      --line: #cfd9d4;
      --text: #14231b;
      --muted: #64746d;
      --brand: #155f38;
      --brand-2: #1f7a49;
      --brand-soft: #e5f4eb;
      --danger: #b42318;
      --shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }
    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      font-family: "Anuphan", "Noto Sans Thai", "Leelawadee UI", "Segoe UI", Tahoma, sans-serif;
      font-size: 16px;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      width: min(100%, 1180px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      box-shadow: 0 1px 0 rgba(16, 24, 40, 0.03);
      min-width: 0;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-header {
      position: sticky;
      top: max(8px, env(safe-area-inset-top));
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(207, 217, 212, 0.9);
      border-radius: 8px;
      padding: 9px 10px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.18rem, 3.9vw, 1.52rem);
      color: var(--brand);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .muted {
      color: var(--muted);
      font-size: clamp(0.88rem, 2.9vw, 1.02rem);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
      font-size: clamp(1.02rem, 2.8vw, 1.14rem);
      font-weight: 900;
      line-height: 1.14;
      letter-spacing: 0;
    }

    .section-title .muted {
      font-weight: 600;
      text-align: right;
    }

    .section-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .mini-btn {
      min-height: 30px;
      border: 1px solid #c7d0da;
      background: #fff;
      color: #1d2a36;
      border-radius: 8px;
      padding: 6px 9px;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.92rem;
      line-height: 1;
      white-space: nowrap;
    }

    .mini-btn:active {
      transform: translateY(1px);
    }

    .btn {
      border: 1px solid #c7d0da;
      background: #fff;
      color: #1d2a36;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 850;
      font-size: clamp(1.02rem, 3.35vw, 1.16rem);
      line-height: 1.08;
      letter-spacing: 0;
      min-height: 44px;
      box-shadow: 0 1px 0 rgba(16, 24, 40, 0.04);
      transition: background 120ms ease, transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      touch-action: manipulation;
      user-select: none;
    }

    .btn:hover {
      background: #f2f6fa;
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(16, 24, 40, 0.09);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .btn.primary {
      border-color: #1f6f43;
      background: var(--brand);
      color: #fff;
    }

    .btn.primary:hover { background: var(--brand-2); }

    .btn.secondary {
      border-color: #b9c7c0;
      background: #f7faf8;
    }

    .btn.utility {
      min-height: 40px;
      padding-inline: 11px;
      font-size: clamp(0.98rem, 2.7vw, 1.08rem);
    }

    .btn.active {
      border-color: var(--brand);
      box-shadow: inset 0 0 0 2px var(--brand), 0 2px 8px rgba(31, 111, 67, 0.16);
      background: var(--brand-soft);
      color: #0f5132;
    }

    .mode-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .mode-actions .btn {
      min-height: 56px;
      font-size: clamp(1.12rem, 4.1vw, 1.42rem);
      line-height: 1.05;
      font-weight: 900;
    }

    .transport-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    #btnPrev,
    #btnNext {
      min-width: 0;
      min-height: clamp(58px, 15vw, 78px);
      font-size: clamp(1.28rem, 5.4vw, 1.82rem);
      line-height: 1.02;
      font-weight: 900;
    }

    #btnRefresh {
      width: 100%;
      margin-top: 7px;
      min-height: 46px;
      font-weight: 800;
      font-size: clamp(1.04rem, 3.3vw, 1.22rem);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      align-content: start;
    }

    .grid .btn {
      min-height: 56px;
      height: 100%;
      font-size: clamp(1rem, 3.45vw, 1.18rem);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: normal;
      line-height: 1.08;
      padding: 8px;
      font-weight: 900;
      word-break: break-word;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    #mainGrid .btn {
      min-height: 60px;
      font-size: clamp(1.04rem, 3.6vw, 1.22rem);
    }

    #subGrid .btn {
      min-height: 54px;
      font-size: clamp(1.02rem, 3.45vw, 1.18rem);
    }

    #subPageGrid {
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    }

    #subPageGrid .btn {
      min-height: 44px;
      font-size: clamp(1rem, 3vw, 1.12rem);
    }

    .state {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      font-size: 0.92rem;
    }

    .state-item {
      min-width: 0;
      border: 1px solid #dbe5df;
      border-radius: 8px;
      padding: 7px;
      background: #f8fbf9;
    }

    .state-item small {
      display: block;
      color: var(--muted);
      font-size: clamp(0.78rem, 2.45vw, 0.9rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 3px;
    }

    .state-item b {
      display: block;
      color: #0f5132;
      font-size: clamp(1rem, 3.25vw, 1.16rem);
      line-height: 1.12;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    .health-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .health-card.collapsed .health-grid {
      display: none;
    }

    .health-item {
      min-width: 0;
      border: 1px solid #dbe5df;
      border-radius: 8px;
      padding: 7px;
      background: #f8fbf9;
    }

    .health-item small {
      display: block;
      color: var(--muted);
      font-size: clamp(0.78rem, 2.45vw, 0.9rem);
      font-weight: 700;
      margin-bottom: 3px;
    }

    .health-item b {
      display: block;
      color: #0f5132;
      font-size: clamp(1rem, 3.25vw, 1.16rem);
      line-height: 1.12;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    .health-dot {
      display: inline-block;
      width: 0.72em;
      height: 0.72em;
      border-radius: 999px;
      margin-right: 6px;
      background: #9aa7a0;
      box-shadow: 0 0 0 3px rgba(154, 167, 160, 0.14);
      vertical-align: middle;
    }

    .health-dot.ok {
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.16);
    }

    .health-dot.warn {
      background: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.16);
    }

    .health-dot.bad {
      background: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.16);
    }

    .gas-config {
      display: none !important;
    }

    .main-card .grid,
    .sub-card .grid,
    .subpage-card .grid {
      max-height: none;
      overflow: visible;
      padding-right: 0;
    }

    @media (min-width: 720px) {
      .wrap {
        gap: 9px;
      }

      .card {
        padding: 10px;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
        gap: 7px;
      }

      .state {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }

    @media (min-width: 900px) {
      body {
        overflow: auto;
      }

      .wrap {
        min-height: calc(100dvh - max(6px, env(safe-area-inset-top)) - max(10px, env(safe-area-inset-bottom)));
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-template-rows: auto auto auto minmax(0, 1fr);
        align-content: start;
      }

      .control-header,
      .state-card {
        grid-column: 1 / -1;
      }

      .health-card {
        grid-column: 1 / span 4;
      }

      .mode-card {
        grid-column: 5 / span 4;
      }

      .autoplay-card {
        grid-column: 9 / span 4;
      }

      .transport-card {
        grid-column: 1 / span 3;
      }

      .main-card {
        grid-column: 4 / span 5;
      }

      .sub-card,
      .subpage-card {
        grid-column: 9 / span 4;
      }

      .subpage-card {
        align-self: start;
      }

      .health-grid {
        grid-template-columns: 1fr;
        max-height: 190px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
    }

    @media (max-width: 520px) {
      body {
        padding-left: max(8px, env(safe-area-inset-left));
        padding-right: max(8px, env(safe-area-inset-right));
      }

      .wrap {
        gap: 7px;
      }

      .control-header {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 7px;
        padding: 8px;
      }

      .control-header .btn {
        width: auto;
      }

      .btn {
        min-height: 44px;
      }

      .section-title {
        align-items: flex-start;
        flex-direction: column;
        gap: 3px;
      }

      .section-title .muted {
        text-align: left;
      }

      .state {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .state-item,
      .health-item {
        padding: 6px;
      }

      .state-item small,
      .health-item small {
        font-size: 0.76rem;
      }

      .state-item b,
      .health-item b {
        font-size: 0.98rem;
        line-height: 1.08;
      }

    }

    @media (max-width: 340px) {
      .control-header {
        grid-template-columns: 1fr;
      }

      .control-header .btn {
        width: 100%;
      }

      .transport-grid,
      .mode-actions,
      .grid,
      .health-grid {
        grid-template-columns: 1fr;
      }

      #btnPrev,
      #btnNext {
        min-height: 54px;
      }

      #mainGrid .btn,
      #subGrid .btn {
        min-height: 52px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="control-header">
      <div>
        <h1>หน้าเว็บควบคุมจอแสดงสินค้า</h1>
        <div class="muted" id="connHint">ใช้ควบคุมข้ามอุปกรณ์ผ่าน Google Apps Script Web App</div>
      </div>
      <button class="btn utility" id="btnReloadMeta">รีโหลดข้อมูล</button>
      <div class="row gas-config" style="margin-top:8px;">
        <input id="gasUrlInput" type="text" placeholder="Google Apps Script Web App URL (https://script.google.com/macros/s/.../exec)" style="flex:1;min-width:320px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;">
        <button class="btn" id="btnSaveGasUrl">บันทึก URL</button>
      </div>
    </header>

    <div class="card state-card">
      <div class="section-title">
        <b>สถานะปัจจุบัน</b>
      </div>
      <div class="state" id="stateLine"></div>
    </div>

    <div class="card health-card" id="healthCard">
      <div class="section-title">
        <b>Health Check ทีวี</b>
        <span class="section-actions">
          <span class="muted" id="healthSummary">รอข้อมูลจอ</span>
          <button class="mini-btn" id="btnToggleHealth" type="button">ซ่อน</button>
        </span>
      </div>
      <div class="health-grid" id="healthLine"></div>
    </div>

    <div class="card mode-card">
      <div class="section-title">
        <b>โหมดแสดงจอ</b>
        <span class="muted" id="wallModeLabel">รอข้อมูลจอหลัก</span>
      </div>
      <div class="mode-actions">
        <button class="btn" id="btnModeSingle">แสดง1จอ</button>
        <button class="btn" id="btnModeWall">แสดง2จอ</button>
      </div>
    </div>

    <div class="card autoplay-card">
      <div class="section-title">
        <b>สลับหน้าอัตโนมัติ</b>
        <span class="muted" id="autoPlayLabel">รอข้อมูลจอหลัก</span>
      </div>
      <div class="mode-actions">
        <button class="btn" id="btnAutoPlayOn">เปิดอัตโนมัติ</button>
        <button class="btn" id="btnAutoPlayOff">หยุดอัตโนมัติ</button>
      </div>
    </div>

    <div class="card transport-card">
      <div class="transport-grid">
        <button class="btn" id="btnPrev">ก่อนหน้า</button>
        <button class="btn" id="btnNext">ถัดไป</button>
      </div>
      <button class="btn secondary" id="btnRefresh">รีเฟรชหน้าจอหลัก</button>
    </div>

    <div class="card main-card">
      <div class="section-title">
        <b>หมวดหลัก</b>
      </div>
      <div class="grid" id="mainGrid"></div>
    </div>

    <div class="card sub-card">
      <div class="section-title">
        <b>หมวดย่อยของหมวดที่เลือก</b>
      </div>
      <div class="grid" id="subGrid"></div>
    </div>

    <div class="card subpage-card">
      <div class="section-title">
        <b>หน้าย่อย (กรณีเกิน 21 รายการ)</b>
      </div>
      <div class="grid" id="subPageGrid"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "tv-price-display-modern-premium-v9";
    const CONTROL_COMMAND_KEY = "tv-display-control-command-v1";
    const CONTROL_META_KEY = "tv-display-control-meta-v1";
    const CONTROL_WEBAPP_KEY = "tv-display-control-webapp-url";
    const CONTROL_CHANNEL_NAME = "tv-display-control-channel-v1";
    const CONTROL_CLIENT_ID_KEY = "tv-display-control-client-id-v1";
    const WALL_MODE_KEY = "tv-display-wall-mode-v1";
    const AUTO_PLAY_KEY = "tv-display-auto-play-v1";
    const HEALTH_COLLAPSED_KEY = "tv-display-health-collapsed-v1";
    const DEFAULT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxxcQZih3EeXbBoBVv9faUUFJ3b9CZaRG70enizHyo-2lNfTbSTDirCo0Txwq9fy_h83g/exec";
    const REMOTE_META_POLL_MS = 900;
    const AUTO_PLAY_PENDING_MS = 7000;
    const APP_VERSION = "display-pwa-fullscreen-20260626";
    const VERSION_CHECK_INTERVAL_MS = 60 * 1000;

    const $ = (id) => document.getElementById(id);

    let meta = null;
    let remoteMetaTimer = null;
    let remoteMetaPollInFlight = false;
    let controlBroadcastChannel = null;
    let pendingAutoPlay = null;
    let autoPlayAckTimer = null;
    let lastIssuedCommandAt = 0;

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>\"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[m]));
    }

    function clean(val) {
      return String(val ?? "").trim();
    }

    function validWebAppUrl(url) {
      return /^https:\/\/script\.google\.com\//i.test(clean(url));
    }

    function createControlClientId() {
      const randomPart = Math.random().toString(16).slice(2, 10);
      return `ctrl-${Date.now()}-${randomPart}`;
    }

    function getControlClientId() {
      try {
        const saved = clean(localStorage.getItem(CONTROL_CLIENT_ID_KEY) || "");
        if (saved) return saved;

        const next = createControlClientId();
        localStorage.setItem(CONTROL_CLIENT_ID_KEY, next);
        return next;
      } catch {
        return createControlClientId();
      }
    }

    function getWebAppUrl() {
      const fromInput = clean($("gasUrlInput").value);
      if (validWebAppUrl(fromInput)) return fromInput;

      const fromLocal = clean(localStorage.getItem(CONTROL_WEBAPP_KEY) || "");
      if (validWebAppUrl(fromLocal)) return fromLocal;

      try {
        const rawMain = localStorage.getItem(STORAGE_KEY);
        const parsed = rawMain ? JSON.parse(rawMain) : null;
        const fromMain = clean(parsed?.controlWebAppUrl || "");
        if (validWebAppUrl(fromMain)) return fromMain;
      } catch {}

      if (validWebAppUrl(DEFAULT_WEBAPP_URL)) return DEFAULT_WEBAPP_URL;

      return "";
    }

    function setHint(text) {
      $("connHint").textContent = text;
    }

    async function checkAppVersion() {
      if (!("fetch" in window) || !("URL" in window)) return;

      try {
        const versionUrl = new URL("version.json", window.location.href);
        versionUrl.searchParams.set("_", String(Date.now()));

        const res = await fetch(versionUrl.toString(), { cache: "no-store" });
        if (!res.ok) return;

        const payload = await res.json();
        const latestVersion = clean(payload?.version);
        if (!latestVersion || latestVersion === APP_VERSION) return;

        const currentUrl = new URL(window.location.href);
        if (currentUrl.searchParams.get("_fresh") === latestVersion) return;

        currentUrl.searchParams.set("_fresh", latestVersion);
        currentUrl.searchParams.set("_ts", String(Date.now()));
        window.location.replace(currentUrl.toString());
      } catch {
        // Local file:// pages and offline devices may block version.json; keep control usable.
      }
    }

    function startVersionCheck() {
      checkAppVersion();
      setInterval(checkAppVersion, VERSION_CHECK_INTERVAL_MS);
    }

    function readHealthCollapsedPreference() {
      try {
        const saved = clean(localStorage.getItem(HEALTH_COLLAPSED_KEY)).toLowerCase();
        if (saved === "0") return false;
        if (saved === "1") return true;
        return true;
      } catch {
        return true;
      }
    }

    function applyHealthCollapsed(collapsed) {
      const card = $("healthCard");
      const btn = $("btnToggleHealth");
      if (!card || !btn) return;

      card.classList.toggle("collapsed", Boolean(collapsed));
      btn.textContent = collapsed ? "แสดง" : "ซ่อน";
      btn.setAttribute("aria-expanded", collapsed ? "false" : "true");

      try {
        localStorage.setItem(HEALTH_COLLAPSED_KEY, collapsed ? "1" : "0");
      } catch {}
    }

    function toggleHealthCollapsed() {
      applyHealthCollapsed(!$("healthCard").classList.contains("collapsed"));
    }

    function storeWallModePreference(mode) {
      const normalized = clean(mode).toLowerCase() === "wall" ? "wall" : "single";

      try {
        localStorage.setItem(WALL_MODE_KEY, normalized);
      } catch {}

      return normalized;
    }

    function readWallModePreference() {
      try {
        const mode = clean(localStorage.getItem(WALL_MODE_KEY)).toLowerCase();
        return mode === "single" || mode === "wall" ? mode : "";
      } catch {
        return "";
      }
    }

    function storeAutoPlayPreference(enabled) {
      const normalized = enabled !== false &&
        clean(enabled).toLowerCase() !== "false" &&
        clean(enabled).toLowerCase() !== "0" &&
        clean(enabled).toLowerCase() !== "paused" &&
        clean(enabled).toLowerCase() !== "off";

      try {
        localStorage.setItem(AUTO_PLAY_KEY, normalized ? "playing" : "paused");
      } catch {}

      return normalized;
    }

    function readAutoPlayPreference() {
      try {
        const mode = clean(localStorage.getItem(AUTO_PLAY_KEY)).toLowerCase();
        if (["paused", "pause", "off", "false", "0", "no"].includes(mode)) return false;
        if (["playing", "play", "on", "true", "1", "yes"].includes(mode)) return true;
      } catch {}

      return true;
    }

    function getAutoPlayEnabledFromMeta(metaPayload = meta) {
      if (!metaPayload || typeof metaPayload !== "object") return null;
      const autoPlay = metaPayload.autoPlay;
      if (!autoPlay || typeof autoPlay !== "object") return null;

      if (typeof autoPlay.enabled === "boolean") return autoPlay.enabled;

      const raw = clean(autoPlay.enabled).toLowerCase();
      if (["playing", "play", "on", "true", "1", "yes"].includes(raw)) return true;
      if (["paused", "pause", "off", "false", "0", "no"].includes(raw)) return false;

      return null;
    }

    function isPendingAutoPlayActive() {
      return pendingAutoPlay && Date.now() - pendingAutoPlay.at < AUTO_PLAY_PENDING_MS;
    }

    function clearAutoPlayAckTimer() {
      if (autoPlayAckTimer) {
        clearTimeout(autoPlayAckTimer);
        autoPlayAckTimer = null;
      }
    }

    function scheduleAutoPlayAckCheck() {
      clearAutoPlayAckTimer();
      autoPlayAckTimer = setTimeout(() => {
        autoPlayAckTimer = null;
        if (!isPendingAutoPlayActive()) {
          pendingAutoPlay = null;
          render();
        }
      }, AUTO_PLAY_PENDING_MS + 150);
    }

    function setPendingAutoPlay(enabled) {
      pendingAutoPlay = {
        enabled: enabled !== false,
        at: Date.now()
      };
      scheduleAutoPlayAckCheck();
    }

    function applyMeta(nextMeta) {
      if (!nextMeta) return;

      const currentUpdatedAt = Number(meta?.updatedAt || 0);
      const nextUpdatedAt = Number(nextMeta.updatedAt || 0);
      if (currentUpdatedAt && nextUpdatedAt && nextUpdatedAt < currentUpdatedAt) return;

      const metaAutoPlay = getAutoPlayEnabledFromMeta(nextMeta);
      if (pendingAutoPlay) {
        if (metaAutoPlay === pendingAutoPlay.enabled) {
          pendingAutoPlay = null;
          clearAutoPlayAckTimer();
        } else if (isPendingAutoPlayActive()) {
          // Keep the real meta, but render the pending user command until the TV confirms it.
        } else {
          pendingAutoPlay = null;
          clearAutoPlayAckTimer();
        }
      }

      meta = nextMeta;
      render();
    }

    function postLocalCommand(cmd) {
      try {
        localStorage.setItem(CONTROL_COMMAND_KEY, JSON.stringify(cmd));
      } catch {}

      try {
        if (!controlBroadcastChannel && "BroadcastChannel" in window) {
          controlBroadcastChannel = new BroadcastChannel(CONTROL_CHANNEL_NAME);
        }
        if (controlBroadcastChannel) controlBroadcastChannel.postMessage(cmd);
      } catch {
        controlBroadcastChannel = null;
      }
    }

    function runJsonp(url, params = {}, timeoutMs = 5000) {
      return new Promise((resolve, reject) => {
        const callbackName = `ctrlJsonp_${Date.now()}_${Math.random().toString(16).slice(2, 8)}`;
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("timeout"));
        }, timeoutMs);

        const cleanup = () => {
          clearTimeout(timer);
          if (window[callbackName]) delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        };

        const u = new URL(url);
        Object.entries(params).forEach(([k, v]) => {
          if (v !== undefined && v !== null) u.searchParams.set(k, String(v));
        });
        u.searchParams.set("callback", callbackName);
        u.searchParams.set("_ts", String(Date.now()));

        window[callbackName] = (payload) => {
          cleanup();
          resolve(payload);
        };

        script.src = u.toString();
        script.onerror = () => {
          cleanup();
          reject(new Error("failed"));
        };
        document.body.appendChild(script);
      });
    }

    function sendCommand(action, extra = {}) {
      const createdAt = Date.now();
      const sourceId = getControlClientId();
      const commandId = `${createdAt}-${sourceId}-${Math.random().toString(16).slice(2, 8)}`;
      lastIssuedCommandAt = createdAt;
      const cmd = {
        id: commandId,
        dedupeKey: commandId,
        createdAt,
        sourceId,
        source: "control",
        action,
        ...extra
      };

      postLocalCommand(cmd);

      const endpoint = getWebAppUrl();
      if (!endpoint) return;
      const payload = JSON.stringify({
        mode: "push_command",
        source: "control",
        command: cmd
      });

      const isCurrentCommand = () => createdAt >= lastIssuedCommandAt;

      const sendOnce = () => {
        if (!isCurrentCommand()) return;

        try {
          if (navigator.sendBeacon) {
            const blob = new Blob([payload], { type: "text/plain;charset=utf-8" });
            if (navigator.sendBeacon(endpoint, blob)) return;
          }
        } catch {}

        try {
          fetch(endpoint, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: payload
          }).catch(() => {});
        } catch {}
      };

      // Retry short bursts to reduce dropped commands over remote network.
      const highReliabilityAction = action === "refresh";
      const retryDelays = highReliabilityAction
        ? [0, 120, 300, 700, 1200, 2000, 3200]
        : [0, 120, 260, 700, 1200];

      retryDelays.forEach((delay) => {
        if (delay === 0) {
          sendOnce();
        } else {
          setTimeout(sendOnce, delay);
        }
      });

      if (highReliabilityAction) {
        // Some locked-down TV browsers miss one storage event; repeat local delivery with a fresh wrapper.
        [180, 520, 1100].forEach((delay) => {
          setTimeout(() => {
            if (isCurrentCommand()) {
              postLocalCommand({ ...cmd, id: `${cmd.id}-local-${delay}` });
            }
          }, delay);
        });
      }
    }

    function readMetaLocal() {
      try {
        const raw = localStorage.getItem(CONTROL_META_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function readMetaRemote() {
      const endpoint = getWebAppUrl();
      if (!endpoint) return Promise.resolve(null);

      return runJsonp(endpoint, { mode: "pull_meta" }, 5000)
        .then((res) => {
          if (res && res.ok && res.meta) return res.meta;
          return null;
        })
        .catch(() => null);
    }

    function getMainPage() {
      if (!meta || !Array.isArray(meta.pages) || !meta.pages.length) return null;
      return meta.pages[meta.currentPageIndex] || meta.pages[0];
    }

    function renderState() {
      const el = $("stateLine");
      if (!meta) {
        el.innerHTML = `<span class="muted">ยังไม่มีข้อมูลจากหน้าจอหลัก กรุณาเปิด index.html ไว้ก่อน</span>`;
        return;
      }
      const page = getMainPage();
      const pageName = page ? page.name : "-";
      const subName = (page && page.subCategories && page.subCategories[meta.currentMotherSubIndex])
        ? page.subCategories[meta.currentMotherSubIndex].name
        : "-";
      const subPageText = `${(meta.currentSubPageIndex || 0) + 1}/${Math.max(1, meta.totalSubPages || 1)}`;
      const wallModeText = meta.wall
        ? (meta.wall.mode === "wall" || meta.wall.enabled
          ? `2 จอ (${Number(meta.wall.screen || 1)}/${Number(meta.wall.screens || 2)})`
          : "1 จอ")
        : "-";
      el.innerHTML = `
        <span class="state-item"><small>หมวด</small><b>${escapeHtml(pageName)}</b></span>
        <span class="state-item"><small>หมวดย่อย</small><b>${escapeHtml(subName)}</b></span>
        <span class="state-item"><small>หน้าย่อย</small><b>${escapeHtml(subPageText)}</b></span>
        <span class="state-item"><small>จำนวนสินค้า</small><b>${Number(meta.viewCount || 0)}</b></span>
        <span class="state-item"><small>โหมดแสดงจอ</small><b>${escapeHtml(wallModeText)}</b></span>
      `;
    }

    function formatTime(value) {
      const timestamp = Number(value || 0);
      if (!timestamp) return "-";
      return new Date(timestamp).toLocaleTimeString("th-TH", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
    }

    function formatAge(value) {
      const timestamp = Number(value || 0);
      if (!timestamp) return "-";
      const seconds = Math.max(0, Math.round((Date.now() - timestamp) / 1000));
      if (seconds < 60) return `${seconds} วินาทีที่แล้ว`;
      const minutes = Math.floor(seconds / 60);
      const remain = seconds % 60;
      return `${minutes} นาที ${remain} วินาทีที่แล้ว`;
    }

    function renderHealth() {
      const el = $("healthLine");
      const summary = $("healthSummary");

      if (!meta || !meta.health) {
        summary.textContent = "รอข้อมูลจอ";
        el.innerHTML = `<span class="muted">ยังไม่มี heartbeat จากทีวี</span>`;
        return;
      }

      const health = meta.health || {};
      const lastSeenAt = Number(health.lastSeenAt || meta.updatedAt || 0);
      const ageMs = lastSeenAt ? Date.now() - lastSeenAt : Infinity;
      const onlineState = ageMs <= 30000 ? "ok" : (ageMs <= 90000 ? "warn" : "bad");
      const onlineText = onlineState === "ok" ? "ออนไลน์" : (onlineState === "warn" ? "สัญญาณช้า" : "ออฟไลน์");
      const sheetState = health.lastSheetLoadOk ? "ok" : "bad";
      const sheetText = health.lastSheetLoadOk ? "โหลดสำเร็จ" : "โหลดมีปัญหา";

      summary.innerHTML = `<span class="health-dot ${onlineState}"></span>${escapeHtml(onlineText)}`;
      el.innerHTML = `
        <span class="health-item"><small>สถานะจอ</small><b><span class="health-dot ${onlineState}"></span>${escapeHtml(onlineText)}</b></span>
        <span class="health-item"><small>เห็นล่าสุด</small><b>${escapeHtml(formatAge(lastSeenAt))}</b></span>
        <span class="health-item"><small>โหลดชีตล่าสุด</small><b><span class="health-dot ${sheetState}"></span>${escapeHtml(sheetText)}</b></span>
        <span class="health-item"><small>เวลาโหลดชีต</small><b>${escapeHtml(formatTime(health.lastSheetLoadAt))}</b></span>
        <span class="health-item"><small>สินค้าบนจอ</small><b>${Number(health.displayedProductCount || 0)} รายการ</b></span>
        <span class="health-item"><small>ป้ายโปรบนจอ</small><b>${Number(health.specialBadgeCount || 0)} ป้าย</b></span>
        <span class="health-item"><small>ข้อมูลในเครื่อง</small><b>${health.cacheReady ? "พร้อม" : "ยังไม่พร้อม"}</b></span>
        <span class="health-item"><small>ข้อความล่าสุด</small><b>${escapeHtml(health.lastSheetLoadMessage || "-")}</b></span>
      `;
    }

    function getWallModeFromMeta() {
      if (!meta || !meta.wall) return readWallModePreference();
      return meta.wall.mode === "wall" || meta.wall.enabled ? "wall" : "single";
    }

    function getAutoPlayFromMeta() {
      if (isPendingAutoPlayActive()) return pendingAutoPlay.enabled;
      const fromMeta = getAutoPlayEnabledFromMeta();
      return fromMeta === null ? readAutoPlayPreference() : fromMeta;
    }

    function renderModeButtons() {
      const mode = getWallModeFromMeta();
      const singleBtn = $("btnModeSingle");
      const wallBtn = $("btnModeWall");
      const label = $("wallModeLabel");

      singleBtn.classList.toggle("active", mode === "single");
      wallBtn.classList.toggle("active", mode === "wall");
      singleBtn.setAttribute("aria-pressed", mode === "single" ? "true" : "false");
      wallBtn.setAttribute("aria-pressed", mode === "wall" ? "true" : "false");

      if (!label) return;
      if (mode === "wall") {
        const screen = Number(meta?.wall?.screen || 0);
        const screens = Number(meta?.wall?.screens || 0);
        label.textContent = screen && screens ? `กำลังแสดง2จอ (${screen}/${screens})` : "เลือกแสดง2จอ";
      } else if (mode === "single") {
        label.textContent = meta?.wall ? "กำลังแสดง1จอ" : "เลือกแสดง1จอ";
      } else {
        label.textContent = "รอข้อมูลจอหลัก";
      }
    }

    function renderAutoPlayButtons() {
      const enabled = getAutoPlayFromMeta();
      const onBtn = $("btnAutoPlayOn");
      const offBtn = $("btnAutoPlayOff");
      const label = $("autoPlayLabel");

      onBtn.classList.toggle("active", enabled === true);
      offBtn.classList.toggle("active", enabled === false);
      onBtn.setAttribute("aria-pressed", enabled === true ? "true" : "false");
      offBtn.setAttribute("aria-pressed", enabled === false ? "true" : "false");

      if (!label) return;
      if (!meta && !isPendingAutoPlayActive()) {
        label.textContent = enabled ? "ตั้งค่าเปิดไว้ในเครื่องนี้" : "ตั้งค่าหยุดไว้ในเครื่องนี้";
      } else {
        label.textContent = enabled ? "กำลังสลับหน้าอัตโนมัติ" : "หยุดสลับหน้าอัตโนมัติ";
      }
    }

    function renderMainButtons() {
      const grid = $("mainGrid");
      grid.innerHTML = "";
      if (!meta || !Array.isArray(meta.pages)) return;

      meta.pages.forEach((p) => {
        const btn = document.createElement("button");
        btn.className = "btn" + (p.index === meta.currentPageIndex ? " active" : "");
        btn.textContent = `${p.index + 1}. ${p.name}`;
        btn.onclick = () => sendCommand("goMain", { pageIndex: p.index });
        grid.appendChild(btn);
      });
    }

    function renderSubButtons() {
      const grid = $("subGrid");
      grid.innerHTML = "";
      const page = getMainPage();
      if (!page) return;

      const subCategories = Array.isArray(page.subCategories) ? page.subCategories : [];
      if (!subCategories.length) {
        const d = document.createElement("div");
        d.className = "muted";
        d.textContent = "หมวดนี้ไม่มีหมวดย่อย";
        grid.appendChild(d);
        return;
      }

      subCategories.forEach((s) => {
        const btn = document.createElement("button");
        btn.className = "btn" + (s.index === meta.currentMotherSubIndex ? " active" : "");
        btn.textContent = `${s.index + 1}. ${s.name}`;
        btn.onclick = () => sendCommand("goSub", { pageIndex: page.index, subIndex: s.index });
        grid.appendChild(btn);
      });
    }

    function renderSubPageButtons() {
      const grid = $("subPageGrid");
      grid.innerHTML = "";
      if (!meta) return;
      const total = Math.max(1, Number(meta.totalSubPages || 1));
      const page = getMainPage();
      const pageIndex = page ? page.index : 0;
      const subIndex = Number(meta.currentMotherSubIndex || 0);

      for (let i = 0; i < total; i++) {
        const btn = document.createElement("button");
        btn.className = "btn" + (i === Number(meta.currentSubPageIndex || 0) ? " active" : "");
        btn.textContent = `หน้า ${i + 1}`;
        btn.onclick = () => sendCommand("goSubPage", {
          pageIndex,
          subIndex,
          subPageIndex: i
        });
        grid.appendChild(btn);
      }
    }

    function render() {
      renderState();
      renderHealth();
      renderModeButtons();
      renderAutoPlayButtons();
      renderMainButtons();
      renderSubButtons();
      renderSubPageButtons();
    }

    function restartRemoteMetaPolling() {
      if (remoteMetaTimer) clearInterval(remoteMetaTimer);
      const endpoint = getWebAppUrl();
      if (!endpoint) return;

      const tick = () => {
        if (remoteMetaPollInFlight) return;
        remoteMetaPollInFlight = true;

        readMetaRemote().then((remoteMeta) => {
          if (remoteMeta) {
            applyMeta(remoteMeta);
            setHint("เชื่อมต่อ GAS แล้ว");
          }
        }).finally(() => {
          remoteMetaPollInFlight = false;
        });
      };
      tick();
      remoteMetaTimer = setInterval(tick, REMOTE_META_POLL_MS);
    }

    function reloadMeta() {
      const localMeta = readMetaLocal();
      if (localMeta) {
        applyMeta(localMeta);
      }

      readMetaRemote().then((remoteMeta) => {
        if (remoteMeta) {
          applyMeta(remoteMeta);
          setHint("เชื่อมต่อ GAS แล้ว");
        } else {
          if (!getWebAppUrl()) {
            setHint("ยังไม่ตั้งค่า GAS URL");
          } else {
            setHint("ยังดึงข้อมูลจาก GAS ไม่ได้ (ตรวจ URL/สิทธิ์ Deploy)");
          }
        }
      });
    }

    $("btnPrev").onclick = () => sendCommand("prev");
    $("btnNext").onclick = () => sendCommand("next");
    $("btnRefresh").onclick = () => {
      sendCommand("refresh");
      setHint("ส่งคำสั่งรีเฟรชแล้ว");
    };
    $("btnReloadMeta").onclick = reloadMeta;
    $("btnToggleHealth").onclick = toggleHealthCollapsed;
    $("btnModeSingle").onclick = () => {
      storeWallModePreference("single");
      renderModeButtons();
      sendCommand("setWallMode", { mode: "single" });
      setHint("สั่งแสดง1จอแล้ว");
    };
    $("btnModeWall").onclick = () => {
      storeWallModePreference("wall");
      renderModeButtons();
      sendCommand("setWallMode", { mode: "wall" });
      setHint("สั่งแสดง2จอแล้ว");
    };
    $("btnAutoPlayOn").onclick = () => {
      const enabled = storeAutoPlayPreference(true);
      setPendingAutoPlay(enabled);
      renderAutoPlayButtons();
      sendCommand("setAutoPlay", { enabled });
      setHint("สั่งเปิดสลับหน้าอัตโนมัติแล้ว");
    };
    $("btnAutoPlayOff").onclick = () => {
      const enabled = storeAutoPlayPreference(false);
      setPendingAutoPlay(enabled);
      renderAutoPlayButtons();
      sendCommand("setAutoPlay", { enabled });
      setHint("สั่งหยุดสลับหน้าอัตโนมัติแล้ว");
    };

    $("btnSaveGasUrl").onclick = () => {
      const url = clean($("gasUrlInput").value);
      if (!validWebAppUrl(url)) {
        setHint("URL ไม่ถูกต้อง (ต้องขึ้นต้นด้วย https://script.google.com/)");
        return;
      }
      try {
        localStorage.setItem(CONTROL_WEBAPP_KEY, url);
      } catch {}
      try {
        const rawMain = localStorage.getItem(STORAGE_KEY);
        const parsed = rawMain ? JSON.parse(rawMain) : {};
        parsed.controlWebAppUrl = url;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
      } catch {}
      setHint("บันทึก GAS URL แล้ว");
      restartRemoteMetaPolling();
      reloadMeta();
    };

    window.addEventListener("storage", (event) => {
      if (event.key === CONTROL_META_KEY) reloadMeta();
      if (event.key === AUTO_PLAY_KEY) renderAutoPlayButtons();
    });

    (function init() {
      applyHealthCollapsed(readHealthCollapsedPreference());
      const saved = getWebAppUrl();
      if (saved) $("gasUrlInput").value = saved;
      restartRemoteMetaPolling();
      reloadMeta();
      startVersionCheck();
    })();
  </script>
</body>
</html>
